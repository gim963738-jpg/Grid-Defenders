<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c20">
  <title>Grid Defenders · 캠프 로비 시안</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/lobby-preview.css">
</head>
<body>
  <main class="camp battle-lobby" aria-label="Grid Defenders 로비 시안">
    <header class="topbar">
      <button class="profile" data-panel="지휘관" aria-label="지휘관 정보"><span class="portrait"></span><span class="profile-copy"><strong>지휘관 <small>Lv.1</small></strong><span class="xp" role="progressbar" aria-label="지휘관 경험치" aria-valuenow="24" aria-valuemin="0" aria-valuemax="100"><i></i></span></span></button>
      <div class="wallet" aria-label="보유 재화"><span><i class="coin" aria-hidden="true">✦</i><b id="gold">480</b></span><span><img class="crystal" src="/assets/lobby/snow-crystal.svg" alt="눈결정 크리스탈"><b>0</b></span></div>
      <button class="settings" data-panel="설정" aria-label="설정">⚙</button>
    </header>
    <section class="scene" aria-label="모닥불 주변에서 쉬는 세 영웅">
      <div class="lobby-stage-banner" aria-label="현재 구역과 최고 기록">
      <div class="stage"><span aria-hidden="true">♧</span> 잊혀진 숲 · 제1구역</div>
      <p class="record"><span></span>최고 웨이브 10<span></span></p>
      </div>
      <svg class="camp-scenery" viewBox="0 199 948 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="/assets/lobby/camp-scene-clean.png" width="948" height="1659" /></svg>
      <div class="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <nav class="side-menu" aria-label="바로가기"><button data-panel="임무" aria-label="임무"><svg class="mission-icon" viewBox="95 80 930 1260" aria-hidden="true"><image href="/assets/lobby/mission-parchment.png" width="1118" height="1407" /></svg></button><button data-panel="우편"><span>✉</span>우편</button><button data-panel="도감"><span>▤</span>도감</button></nav>
    </section>
    <section id="lobby-roster" class="lobby-roster" aria-label="영웅 편성 8칸"></section>
    <section class="depart" aria-label="전투 준비">
      <button class="battle" id="battle"><span aria-hidden="true">⚔</span> 전투 시작</button>
      <div class="management"><button data-panel="영웅"><span aria-hidden="true">♟</span> 영웅 관리</button><i></i><button data-panel="병영 관리"><span class="barracks-mini" aria-hidden="true"></span> 병영 관리</button></div>
    </section>
    <nav class="bottom-nav" aria-label="로비 메뉴">
      <button data-panel="상점"><span class="nav-art art-shop" aria-hidden="true"></span><span>상점</span></button>
      <button data-panel="영웅"><span class="nav-art art-hero" aria-hidden="true"></span><span>영웅</span></button>
      <button class="selected" aria-current="page" id="camp-tab"><span class="nav-art art-battle" aria-hidden="true"></span><span>전투</span></button>
      <button data-panel="병영"><span class="nav-art art-barracks" aria-hidden="true"></span><span>병영</span></button>
      <button data-panel="기록"><span class="nav-art art-record" aria-hidden="true"></span><span>기록</span></button>
    </nav>
  </main>
  <dialog id="panel" aria-labelledby="panel-title"><button class="close" aria-label="닫기">×</button><small>GRID DEFENDERS</small><h1 id="panel-title"></h1><div id="panel-content"></div><button class="dialog-confirm">캠프로 돌아가기</button></dialog>
  <div class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/lobby-preview.ts"></script>
</body>
</html>
