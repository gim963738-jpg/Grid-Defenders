<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발로르 SD 잠정3방향</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#243042;font:16px system-ui}.dark{background:#151d29;color:#eef1f5}header{height:100px;padding:14px 24px}h1{font-size:24px;margin:0 0 8px}button{padding:7px;margin:3px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px}.card{border:1px solid #9caabd;background:#fff;border-radius:6px;overflow:hidden}.dark .card{background:#253244}.label{text-align:center;padding:10px}.stage{position:relative;height:650px;overflow:hidden}.stage img,.tiny img{position:absolute;max-width:none;cursor:zoom-in}.stage:after{content:'';position:absolute;left:10%;right:10%;bottom:20px;border-bottom:1px solid #a2adbc}.tiny{position:relative;height:110px}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}.crop{position:relative;height:320px;overflow:hidden;border:1px solid #9caabd;background:#fff}.dark .crop{background:#253244}.crop img{position:absolute;max-width:none}.cap{position:absolute;bottom:0;background:#edf1f5e8;color:#243042;left:0;right:0;padding:5px;text-align:center}.note{padding:8px 24px}section[hidden]{display:none!important}dialog{width:95vw;height:95vh;background:#bcc6d3}dialog img{max-width:100%;max-height:85vh;object-fit:contain}.capture nav{display:none}</style><header><h1>발로르 SD · 정면0 / 오른쪽앞35 / 오른쪽정90</h1><div>선택1번 결합비율 대조 · 잠정 일러스트 미합격 유지 · 검축 기술미달 잔여 · SD 사용자 평가 전</div><nav><button onclick="mode('art')">전체·표본</button><button onclick="mode('detail')">얼굴·검축·장비</button><button onclick="mode('small')">57 / 72px</button><button onclick="document.body.classList.toggle('dark')">밝음 / 어두움</button></nav></header><section id="art"><div class="grid" id="all"></div></section><section id="detail" hidden><div class="details" id="details"></div></section><section id="small" hidden><p class="note">본체57CSSpx</p><div class="grid" id="s57"></div><p class="note">본체72CSSpx · 실게임/실기기 검증 아님</p><div class="grid" id="s72"></div></section><p class="note">모발끝~지지발바닥 동일키·발선 CSS등비표시. 검끝/캔버스와 구분. PNG 원본은 변형하지 않았습니다. 클릭: 원본 확대.</p><dialog id="zoom"><button onclick="this.parentElement.close()">닫기</button><img id="zoomimage"></dialog><script>const DATA=[{"id": "style-reference", "file": "style-reference.png", "label": "선택1번 · STYLE/PROPORTION", "width": 1070, "height": 1470, "bodyHeight": 1353, "footX": 555, "footY": 1407, "hairTop": 54, "chin": 420, "estimatedScalpCrown": 110, "measurementErrorPx": 12, "scalpErrorPx": 30, "method": "manual visible hair/sole and boot support center; skull under hair estimated; weapon/cape excluded", "sha256": "16d35ca4c3f7b9b40ecc5c0d06717d86b170180662b515cb12c2768606f1120c", "alpha": {"min": 0, "max": 255, "zeroPixels": 1105404, "partialPixels": 465158, "lowPixels1to31": 21511}, "boundsAlpha32": [92, 54, 881, 1408]}, {"id": "front-000", "file": "front-000.png", "label": "발로르 · 정면0", "width": 1070, "height": 1470, "bodyHeight": 1360, "footX": 538, "footY": 1431, "hairTop": 71, "chin": 405, "estimatedScalpCrown": 125, "measurementErrorPx": 12, "scalpErrorPx": 30, "method": "manual visible hair/sole and boot support center; skull under hair estimated; weapon/cape excluded", "sha256": "21027e708d812568b834533cc73d577f37b9ca965b78cd3b8982e326eae6ce28", "alpha": {"min": 0, "max": 255, "zeroPixels": 887390, "partialPixels": 684327, "lowPixels1to31": 14241}, "boundsAlpha32": [126, 71, 945, 1432]}, {"id": "right-035", "file": "right-035.png", "label": "발로르 · 오른쪽앞35", "width": 1070, "height": 1470, "bodyHeight": 1375, "footX": 575, "footY": 1436, "hairTop": 61, "chin": 407, "estimatedScalpCrown": 120, "measurementErrorPx": 12, "scalpErrorPx": 30, "method": "manual visible hair/sole and boot support center; skull under hair estimated; weapon/cape excluded", "sha256": "e467ee8e3a33b6d9bf6ce319e1ff13a281542a9140b6e993a73e95763d9174f2", "alpha": {"min": 0, "max": 255, "zeroPixels": 916942, "partialPixels": 654837, "lowPixels1to31": 13919}, "boundsAlpha32": [119, 62, 915, 1440]}, {"id": "right-090", "file": "right-090.png", "label": "발로르 · 오른쪽정90", "width": 1070, "height": 1470, "bodyHeight": 1370, "footX": 550, "footY": 1427, "hairTop": 57, "chin": 400, "estimatedScalpCrown": 115, "measurementErrorPx": 12, "scalpErrorPx": 30, "method": "manual visible hair/sole and boot support center; skull under hair estimated; weapon/cape excluded", "sha256": "f29b33ad5812d2a9284cc343572c2da3173dead2f8f115908902bba65625ea0d", "alpha": {"min": 0, "max": 255, "zeroPixels": 1129393, "partialPixels": 442619, "lowPixels1to31": 19412}, "boundsAlpha32": [216, 57, 860, 1423]}],by=id=>DATA.find(a=>a.id===id);function zoom(a){document.getElementById('zoomimage').src=a.file;document.getElementById('zoom').showModal()}function card(a,t,n=0){const d=document.createElement('div');d.className='card';d.innerHTML='<div class="label">'+a.label+'</div><div class="'+(n?'tiny':'stage')+'" data-id="'+a.id+'" data-size="'+n+'"><img src="'+a.file+'"></div>';d.querySelector('img').onclick=()=>zoom(a);document.getElementById(t).append(d)}DATA.forEach(a=>{card(a,'all');[57,72].forEach(n=>card(a,'s'+n,n))});
const ROI={"style-reference.png": [[350, 50, 750, 430], [80, 750, 440, 1430], [290, 400, 820, 1060]], "front-000.png": [[350, 65, 720, 420], [195, 730, 800, 1410], [280, 380, 945, 1290]], "right-035.png": [[340, 60, 715, 420], [270, 740, 820, 1400], [300, 390, 855, 1250]], "right-090.png": [[285, 50, 685, 410], [350, 775, 1010, 1380], [335, 390, 705, 1230]]};DATA.forEach(a=>{const rs=ROI[a.file]||[[a.width*.25,0,a.width*.75,a.height*.32],[0,a.height*.48,a.width*.75,a.height],[a.width*.20,a.height*.25,a.width*.9,a.height*.8]];rs.forEach((b,j)=>{let e=document.createElement('div');e.className='crop';Object.assign(e.dataset,{id:a.id,x:b[0],y:b[1],w:b[2]-b[0],h:b[3]-b[1]});e.innerHTML='<img src="'+a.file+'"><div class="cap">'+a.label+' · '+['얼굴/두상','검축/그립','문장/장비'][j]+'</div>';document.getElementById('details').append(e)})});
function register(){const stages=[...document.querySelectorAll('.stage')].filter(e=>e.clientWidth),common=Math.min(570,...stages.map(e=>{const a=by(e.dataset.id);return(e.clientWidth-24)*a.bodyHeight/(a.boundsAlpha32[2]-a.boundsAlpha32[0])}));document.querySelectorAll('.stage,.tiny').forEach(e=>{const a=by(e.dataset.id),s=(+e.dataset.size||common)/a.bodyHeight,im=e.querySelector('img'),base=e.clientHeight-20;im.style.width=a.width*s+'px';im.style.left=e.clientWidth/2-a.footX*s+'px';im.style.top=base-a.footY*s+'px';e.dataset.displayHeight=a.bodyHeight*s;e.dataset.baseline=base});document.querySelectorAll('.crop').forEach(e=>{const a=by(e.dataset.id),s=Math.min((e.clientWidth-12)/e.dataset.w,(e.clientHeight-36)/e.dataset.h),im=e.querySelector('img');im.style.width=a.width*s+'px';im.style.left=(e.clientWidth-e.dataset.w*s)/2-e.dataset.x*s+'px';im.style.top=(e.clientHeight-30-e.dataset.h*s)/2-e.dataset.y*s+'px'})}function mode(m){['art','detail','small'].forEach(k=>document.getElementById(k).hidden=k!==m);register()}document.body.classList.toggle('capture',location.search.includes('capture'));window.addEventListener('resize',register);mode('art');</script></html>
