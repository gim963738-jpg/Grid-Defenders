const gc9Filter=document.createElement('button');gc9Filter.dataset.filter='gc9_red4';gc9Filter.textContent='GC9 포니테일 4구도';document.querySelector('nav').insertBefore(gc9Filter,document.querySelector('[data-filter="eye_balance"]'));
function render(filter='all'){grid.replaceChildren();items.filter(x=>filter==='all'||x[0]===filter||(filter==='pose'&&x[3].includes('/reference_poses/'))).forEach(([type,title,description,path])=>{const card=document.createElement('article'),img=document.createElement('img'),h=document.createElement('h2'),p=document.createElement('p');img.src=path;img.alt=title;img.loading='lazy';h.textContent=title;p.textContent=description;img.onclick=()=>{document.querySelector('#large').src=path;document.querySelector('#large').alt=title;document.querySelector('#caption').textContent=title+' · '+description;viewer.showModal()};card.append(img,h,p);grid.append(card)})}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.filter)});document.querySelector('#close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer)viewer.close()};render();
