<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 제작 모음</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#292722;font:15px system-ui,sans-serif}header{padding:24px;position:sticky;top:0;background:#f4f1ebef;backdrop-filter:blur(10px);z-index:1;border-bottom:1px solid #ddd5c8}h1{margin:0 0 6px;font-size:24px}p{margin:6px 0;color:#726b5f}button{padding:8px 14px;border:1px solid #cfc4b1;background:white;border-radius:20px;cursor:pointer;margin:8px 5px 0 0}button.active{background:#352d21;color:white}main{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:white;border:1px solid #e0d8cc;border-radius:12px;overflow:hidden}article img{width:100%;height:370px;object-fit:contain;background:#faf8f4;cursor:zoom-in}article h2{font-size:16px;margin:12px 14px 4px}article p{margin:0 14px 15px;font-size:13px}dialog{padding:12px;border:0;border-radius:12px;max-width:96vw;max-height:96vh;background:#f4f1eb}dialog::backdrop{background:#000c}dialog img{display:block;max-width:90vw;max-height:82vh;object-fit:contain}dialog button{display:block;margin:0 0 8px auto}a{color:#755c29}</style>
<header><h1>캐릭터 제작 모음</h1><p>캐릭터 1·2 · 메인 일러스트와 도트 제작 참고 자세 · 이미지를 누르면 확대</p><nav><button class="active" data-filter="all">전체</button><button data-filter="main">메인 일러스트</button><button data-filter="pose">참고 자세</button><button data-filter="style_b">새 화풍 B</button><button data-filter="redesign_c">재설계 C</button><button data-filter="char002">캐릭터 2</button></nav></header><main id="gallery"></main>
<dialog id="viewer"><button id="close">닫기 ✕</button><img id="large" alt=""><p id="caption"></p></dialog>
<script>
const items=[["char002","캐릭터 2 · 정면","앞섶 · 허리 장식 · 소매","../char002/reference_poses/char002_front_v01.png"],["char002","캐릭터 2 · 측면","헤어 · 검 · 의상 두께","../char002/reference_poses/char002_side_v01.png"],["char002","캐릭터 2 · 후면","뒷머리 · 후면 의상","../char002/reference_poses/char002_back_v01.png"],["char002","캐릭터 2 · 팔 벌린 자세","소매 안감 · 의상 구조","../char002/reference_poses/char002_open_arms_v01.png"],["char002","캐릭터 2 · 검객","원본 디자인 유지 · 전신 확장","../char002/illustration/char002_illustration_v01.png"],["redesign_c","재설계 C · 메인","비율 · 헤어 · 의상 재설계","redesign_c/char001_main_c_v01.png"],["redesign_c","재설계 C · 정면","새 디자인 정면","redesign_c/char001_front_c_v01.png"],["redesign_c","재설계 C · 측면","새 디자인 측면","redesign_c/char001_side_c_v01.png"],["redesign_c","재설계 C · 후면","새 디자인 후면","redesign_c/char001_back_c_v01.png"],["redesign_c","재설계 C · 팔 벌린 자세","의상 구조 확인","redesign_c/char001_open_arms_c_v01.png"],["style_b","새 화풍 B · 메인","차분한 색감 · 짙은 명암","style_b/char001_main_style_b_v01.png"],["style_b","새 화풍 B · 정면","앞면 디테일","style_b/char001_front_style_b_v01.png"],["style_b","새 화풍 B · 측면","측면 디테일","style_b/char001_side_style_b_v01.png"],["style_b","새 화풍 B · 후면","후면 디테일","style_b/char001_back_style_b_v01.png"],["style_b","새 화풍 B · 양팔 펼침","소매와 의상 구조","style_b/char001_open_arms_style_b_v01.png"],['main','배경 추가 v03','현재 메인 포즈 · 번개 장치 배경','illustration/char001_illustration_draft_v03_background.png'],['main','메인 포즈 v02','고개 수정본 · 배경 추가 전','illustration/char001_illustration_draft_v02.png'],['pose','정면','얼굴 · 앞섶 · 허리 장식','reference_poses/char001_front_v01.png'],['pose','측면','헤어 · 후드 · 옷자락','reference_poses/char001_side_v01.png'],['pose','후면','뒷머리 · 등 · 뒤쪽 문양','reference_poses/char001_back_v01.png'],['pose','양팔 펼친 자세','소매 안감 · 장갑 · 의상 겹침','reference_poses/char001_open_arms_v01.png'],['main','최초 초안 v01','이전 버전 보관','illustration/char001_illustration_draft_v01.png']];
const grid=document.querySelector('#gallery'),viewer=document.querySelector('#viewer');
function render(filter='all'){grid.replaceChildren();items.filter(x=>filter==='all'||x[0]===filter).forEach(([type,title,description,path])=>{const card=document.createElement('article'),img=document.createElement('img'),h=document.createElement('h2'),p=document.createElement('p');img.src=path;img.alt=title;img.loading='lazy';h.textContent=title;p.textContent=description;img.onclick=()=>{document.querySelector('#large').src=path;document.querySelector('#large').alt=title;document.querySelector('#caption').textContent=title+' · '+description;viewer.showModal()};card.append(img,h,p);grid.append(card)})}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.filter)});document.querySelector('#close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer)viewer.close()};render();
</script></html>
