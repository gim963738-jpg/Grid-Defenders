<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>은발 마법사 · 걷기와 달리기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#f4f5f8);color:var(--foreground,#172033);font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}main{max-width:980px;margin:auto;padding:18px}h1{font-size:21px;letter-spacing:-.6px;margin:0 0 4px}p{margin:0}header{margin-bottom:16px}.sub{color:var(--muted-foreground,#606b7e);font-size:13px}.pill{font-size:11px;color:var(--accent-foreground,#fff);background:var(--accent,#4166b0);padding:3px 8px;border-radius:20px;vertical-align:middle;margin-left:5px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;min-height:48px;border:1px solid var(--border,#d1d7e0);border-radius:10px;background:var(--card,#fff);color:var(--foreground,#172033);padding:9px 13px;cursor:pointer}button:hover,button[aria-pressed=true]{background:var(--accent,#4166b0);color:var(--accent-foreground,#fff)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent,#4166b0);outline-offset:2px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent,#4166b0);color:var(--accent-foreground,#fff);border-color:transparent}.spacer{flex:1}label{display:flex;align-items:center;gap:7px}input[type=range]{min-height:48px;accent-color:var(--accent,#4166b0);min-width:0}#zoom{width:130px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;border:1px solid var(--border,#d1d7e0);border-radius:16px;overflow:hidden;background:var(--card,#fff)}.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px}.card-head strong{font-size:17px}.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted-foreground,#606b7e)}.stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:#f0f2f6;touch-action:none;cursor:grab;user-select:none}.stage:active{cursor:grabbing}.stage.dark{background:#1d2431}.stage.checker{background-color:#eee;background-image:linear-gradient(45deg,#d4d9e0 25%,transparent 25%),linear-gradient(-45deg,#d4d9e0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d9e0 75%),linear-gradient(-45deg,transparent 75%,#d4d9e0 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.sprite{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;transform-origin:center;pointer-events:none}.card-foot{padding:8px 16px;font-size:12px;color:var(--muted-foreground,#606b7e)}.timeline{display:flex;gap:10px;align-items:center;margin:10px 0}.timeline input{flex:1;width:30%}.timeline button{padding:9px 16px}.zoomrow{border-top:1px solid var(--border,#d1d7e0);padding-top:12px}.label-small{font-size:12px;color:var(--muted-foreground,#606b7e)}.sheet-panel{border:1px solid var(--border,#d1d7e0);border-radius:14px;padding:12px;background:var(--card,#fff);margin-top:14px}.sheet-panel summary{cursor:pointer;min-height:48px;font-weight:650;display:flex;align-items:center}.sheet-scroller{overflow:auto;max-height:620px}.sheet-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;width:100%;min-width:360px}.thumb{position:relative;border-radius:6px;padding:0;overflow:hidden;aspect-ratio:1;min-height:48px;background:#f0f2f6!important;color:#fff!important}.thumb canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.thumb span{position:absolute;top:3px;left:3px;background:#172033;border-radius:4px;padding:0 4px;font-size:11px}.thumb.selected{outline:3px solid var(--accent,#4166b0);outline-offset:-3px}.legend{margin:6px 0 10px;font-size:12px;color:var(--muted-foreground,#606b7e)}#error{padding:12px;color:#a72f2f}#reference{display:none;align-items:center;gap:12px;padding:10px;margin-bottom:12px;border:1px solid var(--border,#d1d7e0);border-radius:12px}#reference.open{display:flex}#reference img{width:128px;height:128px;image-rendering:pixelated;background:#f0f2f6;border-radius:8px}.reference-text{font-size:13px}output{font-variant-numeric:tabular-nums}footer{margin-top:10px;font-size:12px;color:var(--muted-foreground,#606b7e)}@media(max-width:550px){main{padding:12px}.players{gap:10px}.card-head{padding:9px;flex-direction:column;align-items:flex-start;gap:0}.card-head strong{font-size:15px}.card-foot{padding:7px 9px;font-size:11px}.controls{gap:6px}button,select{padding:8px 10px}#zoom{width:100px}h1{font-size:19px}.timeline button{padding:8px 12px}}@media(max-width:380px){.players{grid-template-columns:1fr}.card-head{flex-direction:row;align-items:center}.stage{max-height:300px}.spacer{display:none}}
</style></head><body><main>
<header><h1>은발 마법사 · 걷기와 달리기 <span class="pill">초안 v01</span></h1><p class="sub">오른쪽 이동 · 동작별 30프레임</p></header>
<div class="controls"><button id="play" class="primary">일시 정지</button><button id="loop" aria-pressed="true">무한 재생 켜짐</button><label>속도 <select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option><option value="2">2배</option></select></label><button id="seam">연결 확인 · 27→01</button></div>
<div class="players">
<article class="card"><div class="card-head"><strong>걷기</strong><output class="count" id="walk-count">01 / 30</output></div><div id="walk-stage" class="stage" aria-label="걷기 미리보기. 휠과 두 손가락으로 확대하고 끌어서 이동합니다."><canvas class="sprite" id="walk-canvas" width="256" height="256"></canvas></div><div class="card-foot">한 주기 1.00초</div></article>
<article class="card"><div class="card-head"><strong>달리기</strong><output class="count" id="run-count">01 / 30</output></div><div id="run-stage" class="stage" aria-label="달리기 미리보기. 휠과 두 손가락으로 확대하고 끌어서 이동합니다."><canvas class="sprite" id="run-canvas" width="256" height="256"></canvas></div><div class="card-foot">한 주기 0.75초</div></article>
</div>
<div class="timeline"><button id="previous" aria-label="이전 프레임">◀</button><label for="frame" class="label-small">프레임</label><input id="frame" type="range" min="0" max="29" step="1" value="0" aria-label="두 동작의 같은 번호 프레임 선택"><output id="frame-number">01</output><button id="next" aria-label="다음 프레임">▶</button></div>
<div class="controls zoomrow"><button id="zoom-out" aria-label="축소">−</button><label for="zoom">확대 <output id="zoom-number">100%</output></label><input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="화면 확대"><button id="zoom-in" aria-label="확대">＋</button><button id="feet">발 확대</button><button id="reset">전체 보기</button></div>
<div class="controls"><span class="label-small">배경</span><button data-bg="light" aria-pressed="true">밝게</button><button data-bg="dark" aria-pressed="false">어둡게</button><button data-bg="checker" aria-pressed="false">격자</button><span class="spacer"></span><button id="reference-button" aria-expanded="false">금발 전사 기준 보기</button></div>
<div id="reference"><img id="reference-image" alt="금발 전사 걷기의 그림체 기준"><div class="reference-text"><strong>그림체 기준</strong><p class="sub">기존 금발 전사 걷기 01번</p></div></div>
<details class="sheet-panel"><summary>전체 시트 · 프레임 순서 보기</summary><div class="controls"><button data-action="walk" aria-pressed="true">걷기</button><button data-action="run" aria-pressed="false">달리기</button><label>시트 확대 <select id="sheet-zoom"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option></select></label></div><p class="legend">01→02→…→30→01 · 왼쪽부터 오른쪽으로, 다음 줄로 이어집니다. 프레임을 누르면 멈춰서 볼 수 있습니다.</p><div class="sheet-scroller"><div class="sheet-grid" id="sheet"></div></div></details>
<p id="error" hidden></p><footer>휠·두 손가락으로 확대하고, 화면을 끌어서 이동할 수 있습니다.</footer>
</main><script>
const ASSETS={walk:{src:'walk/walk-right-30f.png',cell:256,duration:1000},run:{src:'run/run-right-30f.png',cell:256,duration:750},reference:'references/warrior-style-reference.png'};
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let playing=true,looping=true,speed=1,zoom=1,lastTime=null,selectedAction='walk',ready=false;
const players=Object.fromEntries(['walk','run'].map(key=>[key,{key,image:new Image(),frame:0,acc:0,done:false,panX:0,panY:0,pointers:new Map(),stage:$(key+'-stage'),canvas:$(key+'-canvas')} ]));
function drawFrame(p,ctx,index){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,256,256);const c=ASSETS[p.key].cell;ctx.drawImage(p.image,(index%6)*c,Math.floor(index/6)*c,c,c,0,0,256,256);}
function render(p){if(!ready)return;drawFrame(p,p.canvas.getContext('2d'),p.frame);$(p.key+'-count').value=String(p.frame+1).padStart(2,'0')+' / 30';}
function sync(){ $('play').textContent=playing?'일시 정지':'재생';$('loop').textContent=looping?'무한 재생 켜짐':'무한 재생 꺼짐';$('loop').setAttribute('aria-pressed',String(looping));$('frame').value=players.walk.frame;$('frame-number').value=String(players.walk.frame+1).padStart(2,'0');document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('selected',i===players[selectedAction].frame));}
function setPlaying(value){playing=!!value;lastTime=null;if(playing){for(const p of Object.values(players)){if(p.done){p.frame=0;p.acc=0;p.done=false;render(p);}}}sync();}
function setLooping(value){looping=!!value;for(const p of Object.values(players))p.done=false;sync();}
function selectFrame(index){for(const p of Object.values(players)){p.frame=((index%30)+30)%30;p.acc=0;p.done=false;render(p);}setPlaying(false);}
function advance(ms){if(!playing||!ready)return;for(const p of Object.values(players)){if(p.done)continue;const frameMs=ASSETS[p.key].duration/30;p.acc+=ms*speed;const steps=Math.floor((p.acc+1e-7)/frameMs);if(steps){p.acc-=steps*frameMs;const next=p.frame+steps;if(looping)p.frame=next%30;else if(next>=30){p.frame=29;p.done=true;p.acc=0;}else p.frame=next;render(p);}}if(!looping&&Object.values(players).every(p=>p.done))playing=false;sync();}
function tick(time){if(lastTime!==null)advance(Math.min(250,Math.max(0,time-lastTime)));lastTime=time;requestAnimationFrame(tick);}
function transform(p){const lim=(zoom-1)/2;p.panX=clamp(p.panX,-lim,lim);p.panY=clamp(p.panY,-lim,lim);const r=p.stage.getBoundingClientRect();p.canvas.style.transform=`translate(${p.panX*r.width}px,${p.panY*r.height}px) scale(${zoom})`;}
function setZoom(value,anchorPlayer=null,ax=.5,ay=.5){const old=zoom;zoom=clamp(value,1,4);if(anchorPlayer){anchorPlayer.panX=(ax-.5)-(ax-.5-anchorPlayer.panX)*zoom/old;anchorPlayer.panY=(ay-.5)-(ay-.5-anchorPlayer.panY)*zoom/old;}for(const p of Object.values(players))transform(p);$('zoom').value=zoom;$('zoom-number').value=Math.round(zoom*100)+'%';$('zoom-out').disabled=zoom<=1;$('zoom-in').disabled=zoom>=4;}
function resetView(){for(const p of Object.values(players)){p.panX=0;p.panY=0;}setZoom(1);}
function focusFeet(){setZoom(2);for(const p of Object.values(players)){p.panX=.03;p.panY=-.45;transform(p);}}
for(const p of Object.values(players)){
 p.stage.addEventListener('wheel',e=>{e.preventDefault();const r=p.stage.getBoundingClientRect();setZoom(zoom*Math.exp(-e.deltaY*.0015),p,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);},{passive:false});
 p.stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;p.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});p.stage.setPointerCapture(e.pointerId);});
 p.stage.addEventListener('pointermove',e=>{if(!p.pointers.has(e.pointerId))return;const previous=[...p.pointers.values()],old=p.pointers.get(e.pointerId);p.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=p.stage.getBoundingClientRect();if(p.pointers.size===1){p.panX+=(e.clientX-old.x)/r.width;p.panY+=(e.clientY-old.y)/r.height;}else if(p.pointers.size===2){const now=[...p.pointers.values()],a=previous[0],b=previous[1],c=now[0],d=now[1],before=Math.hypot(a.x-b.x,a.y-b.y),after=Math.hypot(c.x-d.x,c.y-d.y);if(before>2){setZoom(zoom*after/before,p,((a.x+b.x)/2-r.left)/r.width,((a.y+b.y)/2-r.top)/r.height);p.panX+=((c.x+d.x-a.x-b.x)/2)/r.width;p.panY+=((c.y+d.y-a.y-b.y)/2)/r.height;}}transform(p);});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])p.stage.addEventListener(event,e=>p.pointers.delete(e.pointerId));new ResizeObserver(()=>transform(p)).observe(p.stage);
}
function buildSheet(){if(!ready)return;const p=players[selectedAction];$('sheet').replaceChildren();for(let i=0;i<30;i++){const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',`${selectedAction==='walk'?'걷기':'달리기'} ${i+1}번 프레임`);const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;drawFrame(p,canvas.getContext('2d'),i);const label=document.createElement('span');label.textContent=String(i+1).padStart(2,'0');b.append(canvas,label);b.onclick=()=>selectFrame(i);$('sheet').append(b);}sync();}
$('play').onclick=()=>setPlaying(!playing);$('loop').onclick=()=>{setLooping(!looping);if(looping&&!playing)setPlaying(true);};$('previous').onclick=()=>selectFrame(players.walk.frame-1);$('next').onclick=()=>selectFrame(players.walk.frame+1);$('frame').oninput=e=>selectFrame(Number(e.target.value));$('speed').onchange=e=>{speed=Number(e.target.value);};$('seam').onclick=()=>{selectFrame(26);setLooping(true);setPlaying(true);};$('zoom-in').onclick=()=>setZoom(zoom+.25);$('zoom-out').onclick=()=>setZoom(zoom-.25);$('zoom').oninput=e=>setZoom(Number(e.target.value));$('feet').onclick=focusFeet;$('reset').onclick=resetView;
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));for(const p of Object.values(players))p.stage.className='stage '+b.dataset.bg;});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{selectedAction=b.dataset.action;document.querySelectorAll('[data-action]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));buildSheet();});
$('sheet-zoom').onchange=e=>{$('sheet').style.width=Number(e.target.value)*100+'%';};$('reference-button').onclick=()=>{const open=$('reference').classList.toggle('open');$('reference-button').setAttribute('aria-expanded',String(open));};$('reference-image').src=ASSETS.reference;
window.magePreview={selectFrame,setPlaying,setLooping,setZoom,resetView,focusFeet,advance,players,get playing(){return playing},get looping(){return looping},get zoom(){return zoom},get speed(){return speed},get selectedAction(){return selectedAction},get ready(){return ready}};
async function loadPlayer(p){await new Promise((resolve,reject)=>{p.image.onload=resolve;p.image.onerror=()=>reject(Error(p.key+' 이미지를 불러오지 못했습니다.'));p.image.src=ASSETS[p.key].src;});}
Promise.all(Object.values(players).map(loadPlayer)).then(()=>{ready=true;for(const p of Object.values(players))render(p);buildSheet();setZoom(1);document.documentElement.dataset.ready='true';requestAnimationFrame(tick);}).catch(e=>{$('error').hidden=false;$('error').textContent=e.message;});
</script></body></html>
