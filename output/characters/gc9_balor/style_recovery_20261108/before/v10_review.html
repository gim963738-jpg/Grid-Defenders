<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발로르 v10 · C6 금속·사선 비교</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f1eb;color:#26363c;font:14px/1.6 system-ui,sans-serif}h1{font-size:20px;margin:0}p{margin:6px 0}button{font:inherit;padding:8px 10px;min-height:44px;border:1px solid #bbc4c5;border-radius:6px;background:white;cursor:pointer}button[aria-pressed=true]{background:#245264;color:white}nav{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{min-width:0;border:1px solid #cbd0cc;border-radius:9px;overflow:hidden;background:white}.label{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;gap:6px}.stage{height:500px;position:relative;overflow:hidden;background:var(--stage,#fff)}.stage img{position:absolute;max-width:none;height:auto;left:50%;transform:translateX(-50%);display:block}.crop{height:330px;position:relative;overflow:hidden;background:var(--stage,#fff)}.crop img{position:absolute;max-width:none;height:auto}.fine{font-size:12px;color:#5f6b70}.note{font-size:12px;padding:10px;border-left:3px solid #9e8050;background:#fffcf3;margin:12px 0}a{color:#1e5d73}details{margin:14px 0}summary{cursor:pointer;min-height:44px}body.dark{--stage:#161b22}body.raw .stage img{width:100%!important;height:100%;object-fit:contain;left:0!important;top:0!important;transform:none!important}</style>
<h1>발로르 v10 · C6 금속·사선 비교</h1><p class="fine">금속 보정 정면 + C6와 같은 방향의 사선 시안 · 사용자 확인 대기</p>
<nav><button id="quarter" aria-pressed="true" onclick="choose('quarter')">C6 사선 비교</button><button id="front" onclick="choose('front')">C6 정면 비교</button><button id="before" onclick="choose('before')">금속 수정 전·후</button><button id="detailToggle" onclick="detailMode=!detailMode;document.getElementById('detailToggle').textContent=detailMode?'전신으로 돌아가기':'얼굴·금속 확대';layout()">얼굴·금속 확대</button></nav>
<nav><button id="aligned" aria-pressed="true" onclick="setMode(false)">인물 높이 맞춤</button><button id="raw" aria-pressed="false" onclick="setMode(true)">원본 캔버스</button><button onclick="document.body.classList.remove('dark')">밝은 배경</button><button onclick="document.body.classList.add('dark')">어두운 배경</button></nav>
<main class="grid"><section class="card"><div class="label"><strong id="labelL"></strong><a id="linkL" target="_blank">원본</a></div><div class="stage"><img id="left" alt="발로르 비교 이미지"></div></section><section class="card"><div class="label"><strong id="labelR"></strong><a id="linkR" target="_blank">원본</a></div><div class="stage"><img id="right" alt="C6 또는 수정 전 비교 이미지"></div></section></main>
<div class="note" id="caption"></div>
<details id="details"><summary>얼굴·견갑 확대 비교</summary><p class="fine">보기 크기만 조절한 확대 창입니다. 원본 PNG 크기와 바이트는 그대로 보존했습니다.</p><div class="grid"><section class="card"><div class="label" id="detailL"></div><div class="crop"><img id="cropL" alt="발로르 얼굴·견갑 확대"></div></section><section class="card"><div class="label" id="detailR"></div><div class="crop"><img id="cropR" alt="비교 얼굴·견갑 확대"></div></section></div></details>
<p class="fine"><a href="front_v10.png">정면 PNG</a> · <a href="threequarter_v10.png">사선 PNG</a> · <a href="generation-records.json">참조·프롬프트 기록</a> · <a href="../../char001/gallery.html#origin=west">캐릭터 제작 모음</a></p>
<script>
const records={front:{src:'front_v10.png',label:'발로르 · 금속 보정 정면 v10',top:373,bottom:1386,center:512,detailScale:1.5},quarter:{src:'threequarter_v10.png',label:'발로르 · 오른쪽 앞 사선 v10',top:377,bottom:1436,center:520,detailScale:1.5},c6front:{src:'../../../character-redesign-6x2/images/c06_front.png',label:'C6 · 금발·흰 판금 · 정면 v1',top:17,bottom:1497,center:512,detailScale:1},c6quarter:{src:'../../../character-redesign-6x2/images/c06_threequarter.png',label:'C6 · 금발·흰 판금 · 오른쪽 앞 사선 v1',top:15,bottom:1510,center:485,detailScale:1},old:{src:'../gc9_rebuild_v09/front_v09.png',label:'발로르 · 수정 전 정면 v09',top:375,bottom:1386,center:512,detailScale:1.5}};
let pair=[records.quarter,records.c6quarter],detailMode=false;
function layout(){if(detailMode){document.body.classList.remove('raw');document.querySelectorAll('.stage').forEach(e=>e.style.height='410px');for(const [i,id]of ['left','right'].entries()){const r=pair[i],img=document.getElementById(id);img.style.width=1024*r.detailScale+'px';img.style.top=12-r.top*r.detailScale+'px';img.style.left='calc(50% + '+(512-r.center)*r.detailScale+'px)';}return;}document.querySelectorAll('.stage img').forEach(e=>e.style.left='50%');const width=document.querySelector('.stage').clientWidth,available=Math.max(350,Math.min(640,innerHeight-290)),visible=Math.min(available-40,(width-24)*1.5);document.querySelectorAll('.stage').forEach(e=>e.style.height=(document.body.classList.contains('raw')?available:visible+40)+'px');for(const [i,id]of ['left','right'].entries()){const r=pair[i],img=document.getElementById(id),scale=visible/(r.bottom-r.top+1);img.style.width=1024*scale+'px';img.style.top=20-r.top*scale+'px';} }
function choose(mode){pair=mode==='front'?[records.front,records.c6front]:mode==='before'?[records.old,records.front]:[records.quarter,records.c6quarter];['quarter','front','before'].forEach(id=>document.getElementById(id).setAttribute('aria-pressed',mode===id));for(const [i,side]of ['L','R'].entries()){const r=pair[i],img=document.getElementById(i?'right':'left'),crop=document.getElementById('crop'+side);img.src=crop.src=r.src;document.getElementById('label'+side).textContent=document.getElementById('detail'+side).textContent=r.label;document.getElementById('link'+side).href=r.src;crop.style.width=1024*r.detailScale+'px';crop.style.left='calc(50% - '+r.center*r.detailScale+'px)';crop.style.top=12-r.top*r.detailScale+'px';}document.getElementById('caption').textContent=mode==='quarter'?'두 인물 모두 얼굴이 화면 왼쪽을 향하는 같은 사선입니다. 발로르 왼손 방패가 가까운 쪽입니다. 인물 높이는 화면에서만 맞춰 얼굴선·판금 명암·반사를 비교합니다.':mode==='front'?'좁게 반복되던 흰 반사 띠를 줄이고 큰 은색 밝은 면·회보라 그림자 면으로 보정했습니다.':'왼쪽 v09 → 오른쪽 v10. 견갑·팔갑·정강이와 방패의 반사 띠·명암 면을 비교합니다.';layout();}
function setMode(raw){detailMode=false;document.getElementById("detailToggle").textContent="얼굴·금속 확대";document.body.classList.toggle('raw',raw);document.getElementById('raw').setAttribute('aria-pressed',raw);document.getElementById('aligned').setAttribute('aria-pressed',!raw);layout();}addEventListener('resize',layout);addEventListener('load',layout);choose('quarter');
</script></html>
