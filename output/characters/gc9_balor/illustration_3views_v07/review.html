<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발로르 · 방패 각도 수정</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f1ed;color:#24313c;font:15px/1.6 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}h2{font-size:17px}button{min-height:44px;padding:6px 12px;font:inherit;cursor:pointer}a{color:#206479}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin:auto}.frame{background:#fff;border:1px solid #ddd}.frame img{display:block;width:100%;height:auto}p{margin:8px 0 14px}.links{display:flex;flex-wrap:wrap;gap:12px}@media(max-width:500px){.views{grid-template-columns:1fr}}</style>
<h1>발로르 · 방패 각도 수정</h1><p>오른쪽 정측면과 후면에서 방패의 각도를 조절한 수정본입니다. 팔·손·검·몸의 자세는 기존 모습을 기준으로 유지했습니다.</p>
<p><button id="version" onclick="toggleVersion()">이전 v05와 비교</button> <button onclick="setBg('#fff')">밝은 배경</button> <button onclick="setBg('#26333f')">어두운 배경</button> <span id="state">수정 v07</span></p>
<main class="views"><section><h2>오른쪽 정측면</h2><div class="frame"><img id="right" src="right.png" alt="오른쪽 정측면 방패 각도 수정본"></div><p class="links"><a href="right.png" target="_blank">원본 PNG</a><a href="right.prompt.txt">프롬프트</a></p></section><section><h2>후면</h2><div class="frame"><img id="back" src="back.png" alt="후면 방패 각도 수정본"></div><p class="links"><a href="back.png" target="_blank">원본 PNG</a><a href="back.prompt.txt">프롬프트</a></p></section></main>
<p>각 1024×1536 생성 원본 · 정면 v06은 유지 · <a href="../../char001/gallery.html">캐릭터 제작 모음</a></p>
<script>let old=false;function toggleVersion(){old=!old;for(const v of ['right','back'])document.getElementById(v).src=(old?'../illustration_3views_v05/':'')+v+'.png';document.getElementById('state').textContent=old?'이전 v05':'수정 v07';document.getElementById('version').textContent=old?'수정 v07 보기':'이전 v05와 비교'}function setBg(c){for(const f of document.querySelectorAll('.frame'))f.style.background=c}</script></html>
