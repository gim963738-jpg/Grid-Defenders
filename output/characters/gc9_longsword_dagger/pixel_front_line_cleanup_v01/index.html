<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD 정면 v01 · 선 정리</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#eeeae3;color:#263242;font:16px/1.5 Arial,'Malgun Gothic',sans-serif}h1{font-size:24px;margin:0 0 8px}p{margin:6px 0}main{max-width:1300px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#fffdf9;border:1px solid #c9c5be;border-radius:8px;padding:12px}figcaption{font-weight:bold}img{display:block;width:100%;height:auto;image-rendering:pixelated}button,a{font:inherit;padding:8px 12px;border:1px solid #9a9a9a;border-radius:6px;color:inherit;text-decoration:none;background:none;cursor:pointer}figure a{display:block;padding:0;border:0;border-radius:0}.dark{background:#1e2734;color:#e9edf5}.dark figure{background:#303a4b}nav{margin:14px 0}.note{color:#718096;font-size:13px}@media(max-width:650px){body{padding:12px}h1{font-size:19px}}</style><body><main><h1>금발 장검·단검 · SD 픽셀 정면 v01 선 정리</h1><p>지정한 v01의 비율·정면 자세·장비로 돌아가 선과 덩어리 경계를 정리한 시안입니다.</p><nav><button id="toggle">밝게 / 어둡게</button> <a href="front-cleanup.png">수정 PNG 원본</a></nav><div class="grid"><figure><figcaption>기존 정면 v01</figcaption><a href="original.png"><img src="original.png" alt="기존 정면 v01"></a></figure><figure><figcaption>선 정리 시안</figcaption><a href="front-cleanup.png"><img src="front-cleanup.png" alt="선 정리 시안"></a></figure></div><p class="note">원본은 보존하고 별도로 제작했습니다. 각 PNG는 실제 반환 바이트 그대로이며 비교에서만 등비 표시합니다.</p></main><script>if(location.hash==='#dark')document.body.classList.add('dark');document.querySelector('#toggle').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
