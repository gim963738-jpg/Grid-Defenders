<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같은 자세 · 신체 비율 비교</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#edeae4;color:#243344;font:16px/1.5 Arial,'Malgun Gothic',sans-serif}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0}nav{margin:12px 0}a,button{color:inherit;font:inherit}.viewport{width:100%;overflow:hidden}.board{width:1616px;display:grid;grid-template-columns:repeat(2,800px);gap:16px;transform-origin:top left}figure{margin:0;background:#fffdf8;border:1px solid #bac2cc;border-radius:7px;overflow:hidden}figcaption{font-weight:bold;padding:12px}.stage{position:relative;width:800px;height:610px;overflow:hidden}.stage img{position:absolute;max-width:none;height:auto;image-rendering:pixelated}.stage:after{content:'';position:absolute;top:560px;left:10px;right:10px;border-top:1px dashed #bac2cc;pointer-events:none}.dark{background:#202937;color:#edf1f7}.dark figure{background:#303b4d}small{color:#76859a}</style><body><h1>동일 전투 준비 자세 · 신체 비율 비교</h1><p>SD식 얼굴·선·명암은 유지하고 머리의 상대적 크기를 줄여 몸통·팔·다리를 일러스트 비율로 조정했습니다.</p><nav><button id="theme">밝게 / 어둡게</button> · <a href="combat-ready-illustration-proportions.png">신규 PNG</a> · <a href="report.md">검수 기록</a></nav><div class="viewport"><div class="board"><figure><figcaption>기존 · SD 신체 비율</figcaption><div class="stage"><img src="sd-pose-original.png" alt="기존 · SD 신체 비율" style="width:768.0px;left:120.0px;top:54.5px"></div></figure><figure><figcaption>신규 · SD 그림체 + 일러스트 신체 비율</figcaption><div class="stage"><img src="combat-ready-illustration-proportions.png" alt="신규 · SD 그림체 + 일러스트 신체 비율" style="width:491.5185783521809px;left:206.13893376413571px;top:56.7689822294023px"></div></figure></div></div><p><small>전체 표시 키와 발선을 CSS에서만 맞췄습니다. 두 개별 PNG는 생성 실제 크기와 바이트를 유지합니다.</small></p><script>function fit(){let v=document.querySelector('.viewport'),b=document.querySelector('.board'),s=Math.min(1,v.clientWidth/1616);b.style.transform=`scale(${s})`;v.style.height=`${b.offsetHeight*s}px`};window.addEventListener('resize',fit);fit();document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
