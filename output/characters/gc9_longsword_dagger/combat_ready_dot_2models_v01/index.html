<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두 신체 비율 · 도트 표현</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#edeae4;color:#243344;font:16px/1.5 Arial,'Malgun Gothic',sans-serif}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0}nav{margin:12px 0}a,button{color:inherit;font:inherit}button{background:transparent;border:1px solid #91a0b0;border-radius:4px;padding:5px 10px}.viewport{width:100%;overflow:hidden}.board{width:1616px;display:grid;grid-template-columns:repeat(2,800px);gap:16px;transform-origin:top left}figure{margin:0;background:#fffdf8;border:1px solid #bac2cc;border-radius:7px;overflow:hidden}figcaption{font-weight:bold;padding:12px}.stage{position:relative;width:800px;height:610px;overflow:hidden}.stage img{position:absolute;max-width:none;height:auto;image-rendering:pixelated}.stage:after{content:'';position:absolute;top:560px;left:10px;right:10px;border-top:1px dashed #bac2cc;pointer-events:none}.dark{background:#202937;color:#edf1f7}.dark figure{background:#303b4d}small{color:#76859a}</style><body><h1>두 모델 · 도트 표현 비교</h1><p>신체 비율과 오른쪽3/4 전투태세를 각각 유지하며, 픽셀 덩어리·색 단계·계단형 윤곽으로 새로 제작했습니다.</p><nav><button id="theme">밝게 / 어둡게</button> · <a href="model-a-sd-dot.png">A PNG</a> · <a href="model-b-illustration-body-dot.png">B PNG</a> · <a href="report.md">검수 기록</a></nav><div class="viewport"><div class="board"><figure><figcaption>A · SD 신체 비율 · 도트</figcaption><div class="stage"><img src="model-a-sd-dot.png" alt="A · SD 신체 비율 · 도트" style="width:763.4194831013917px;left:126.64015904572562px;top:55.02982107355865px"></div></figure><figure><figcaption>B · 일러스트 신체 비율 · 도트</figcaption><div class="stage"><img src="model-b-illustration-body-dot.png" alt="B · 일러스트 신체 비율 · 도트" style="width:485.634477254589px;left:208.45969672785316px;top:58.40383080606546px"></div></figure></div></div><p><small>전신 표시 높이/발선은 CSS에서만 맞췄으며 개별 PNG 원본은 리샘플링하지 않았습니다. 실제128px 네이티브 도트 파일/정규화 팔레트 납품과는 구분되는 생성 시안입니다.</small></p><script>function fit(){let v=document.querySelector('.viewport'),b=document.querySelector('.board'),s=Math.min(1,v.clientWidth/1616);b.style.transform=`scale(${s})`;v.style.height=`${b.offsetHeight*s}px`};window.addEventListener('resize',fit);fit();document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');</script></body></html>
