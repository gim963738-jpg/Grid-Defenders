<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102426;color:#f0ead8;font-family:'Malgun Gothic',sans-serif}.stage{width:800px;height:360px;position:relative;transform-origin:0 0;overflow:hidden;background:#5c6053}.terrain{position:absolute;inset:0;background-size:100% 100%;background-position:center}.edge{position:absolute;inset:0;box-shadow:inset 0 0 25px #111a1938;pointer-events:none}.panel{background:linear-gradient(135deg,#1c3838ed,#11272cf0);border:1px solid #a49062;border-radius:13px;box-shadow:inset 0 1px #c5c6aa33,0 4px 10px #071d234a}.hud{position:absolute;left:12px;top:8px;display:flex;gap:8px;height:48px}.hud section{height:48px;padding:5px 12px;display:flex;align-items:center;gap:10px}.hud .wave{width:104px;border-radius:24px}.wave small{font-size:12px;letter-spacing:1px;color:#c5d5c9}.wave b{font-size:22px;color:#eed59d}.clock{width:88px;display:block!important;text-align:center;padding:3px 8px!important}.clock small{font-size:12px;display:block;color:#baccc0}.clock b{font-size:18px;display:block;line-height:22px}.wallet{width:112px;display:block!important;padding:4px 10px!important}.wallet div{display:flex;justify-content:space-between;font-size:14px;line-height:19px}.wallet small{font-size:12px;color:#bdcbbb}.wallet b{font-size:14px;color:#e9cd8d}.enemy-status{position:absolute;left:420px;top:8px;height:48px;width:128px;padding:5px 10px}.enemy-status small{display:block;font-size:12px;color:#c1cfc2}.enemy-status strong{font-size:16px;line-height:22px}.enemy-status em{font-style:normal;color:#e4c78e}.controls{position:absolute;right:12px;top:8px;display:flex;gap:8px}button{min-width:48px;min-height:48px;font-family:inherit;touch-action:manipulation;border:1px solid #b19b70;border-radius:12px;background:linear-gradient(145deg,#355a56f5,#1b383bf7);color:#f1ecd9;box-shadow:inset 0 1px #d1d7bd40,0 3px 8px #07181e66;font-size:14px;font-weight:700;padding:4px}.controls button{width:48px;height:48px;display:flex;  7px;border-radius:12px;background:#172b2cb5;text-align:center;color:#f4e2c1;font-size:12px;text-shadow:0 1px 2px #000}.arrival b{font-size:18px;margin-right:3px}.number{position:absolute;left:12px;bottom:12px;width:34px;height:34px;display:grid;place-items:center;border:1px solid #c4ae77;border-radius:9px;background:#173235e8;color:#eddaaa;font-size:16px;font-weight:700}.concept-title{position:absolute;left:56px;bottom:12px;text-shadow:0 1px 5px #081b1c}.concept-title small{display:block;font-size:12px;line-height:17px;color:#e3ddbf}.concept-title h1{font-size:20px;margin:0;line-height:25px;color:#fff4d5;font-weight:700;letter-spacing:-.5px}.proposal{position:absolute;right:110px;bottom:12px;font-size:12px;color:#d9e1cf;text-shadow:0 1px 3px #0b1a1b;line-height:18px}.shot{position:absolute;height:2px;width:60px;background:linear-gradient(90deg,transparent,#ffe9b3);box-shadow:0 0 3px #f5ce7933;transform:rotate(-5deg)}.demon .slots{background:#a1acc111}.demon .slot{border-color:#d4dbe545}.demon .actor{filter:drop-shadow(0 2px 2px #020810) drop-shadow(0 0 1px #cae0df88)}
.concept-title{left:50px;bottom:10px;padding:2px 12px 2px 8px;border-radius:5px;background:linear-gradient(90deg,#102c2ac9,#102c2a35)}.proposal{background:#12302aa6;border-radius:5px;padding:3px 8px;right:108px;bottom:8px}</style><link rel="stylesheet" href="skins.css"><style>
.stage{height:720px;background:#101c24; padding:16px;color:#f4efe3}.board-title{font-size:22px;margin:0 0 3px}.intro{font-size:12px;color:#aebcc4;margin:0 0 18px}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.sample{background:linear-gradient(150deg,#26323a,#18242d);border:1px solid #4e626b;border-radius:12px;padding:12px}.sample h2{font-size:20px;margin:0}.sample p{font-size:12px;line-height:18px;color:#c5cdd0;height:42px;margin:5px 0 12px}.sample-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.sample-row>span{font-size:12px;width:44px;color:#c2ced0}.sample button{position:relative;width:84px;height:48px;display:flex;gap:6px;align-items:center;justify-content:center;font-size:14px;font-family:inherit}.sample button svg{width:25px;height:25px;flex:none}.sample .icon-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #5d6f7055}.sample .icon-row button{width:48px;height:48px;min-width:48px}.sample .legend{font-size:12px;line-height:20px;color:#a6b6be;margin-top:12px}.board-note{font-size:12px;line-height:20px;color:#b8c6cc;margin:15px 0 0}
</style><body><main id="stage" class="stage"></main><script>
const themes=[['설산성채','서릿빛 성채의 방어선','snow'],['사막유적','모래 아래 잠든 유적','desert'],['해안항구','푸른 항구의 전초기지','coast']];
const designs=['D1 · 무광 금속','D2 · 주조 프레임','D3 · 차콜 글라스'];
const entries=Array.from({length:9},(_,i)=>[String(i+1).padStart(2,'0'),themes[Math.floor(i/3)][0],themes[Math.floor(i/3)][1],themes[Math.floor(i/3)][2]]);
const assets='../../../게임/public/assets/';
const paths={guard:'soldiers/guard-idle-v1.png',archer:'soldiers/archer-idle-v1.png',mage:'heroes/ranged-idle.png',melee:'heroes/melee-idle.png',ranged:'heroes/ranged-idle.png',red:'monsters/slimes-v1/idle-red.png',blue:'monsters/slimes-v1/idle-blue.png',yellow:'monsters/slimes-v1/idle-yellow.png'};
const image=(kind,h=44)=>['red','blue','yellow'].includes(kind)?`<svg width="48" height="${h}" viewBox="0 0 128 128"><svg width="128" height="128" viewBox="768 0 128 128" overflow="hidden"><image href="${assets+paths[kind]}" width="1024" height="128"/></svg></svg>`:`<img src="${assets+paths[kind]}" width="48" height="${h}" alt="${kind}">`;
function actor(k,x,y,h,hp=100){return `<div class="actor ${['red','blue','yellow'].includes(k)?'monster':'ally'}" style="left:${x-24}px;top:${y-h}px;height:${h}px">${image(k,h)}<span class="hp"><i style="width:${hp}%"></i></span></div>`}
const svg=(path)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
const icons={soldier:svg('<path d="m5 20 14-16 1 1L7 21M4 15l6 5M2 22l4-4"/>'),hero:svg('<path d="M6 21v-7a6 6 0 0 1 12 0v7M6 15h12M9 8V5l3-2 3 2v3M10 16v5m4-5v5M4 21h16"/>'),shop:svg('<path d="m7 8 3-5h4l3 5M7 8q-5 8-3 11 1 3 8 3t8-3q2-3-3-11ZM8 9h8M12 12v6m2-5h-3a1 1 0 0 0 0 2h2a1 1 0 0 1 0 2h-3"/>'),formation:svg('<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/>'),bag:svg('<path d="M5 8h14l2 13H3ZM8 8V5a4 4 0 0 1 8 0v3M3 12h18m-12 0v5h6v-5"/>'),pause:svg('<path d="M8 4v16M16 4v16"/>'),settings:svg('<path d="m10 2 4 0 1 4 4 1 3 3-3 3-1 4-4 1-2 4-3-3-4-1-1-4-3-2 3-3 1-4 4-1Z"/><circle cx="12" cy="12" r="3"/>'),home:svg('<path d="m3 11 9-8 9 8M5 9v12h14V9M10 21v-7h4v7"/>')};
function scene(){let s='<div class="slots">';for(let i=0;i<20;i++)s+=`<div class="slot">${[1,3,6,8,11,13,16,18].includes(i)?'<span class="pedestal"></span>':''}</div>`;s+='</div>';const kinds=['archer','guard','ranged','guard','archer','melee','mage','guard'];[1,3,6,8,11,13,16,18].forEach((slot,i)=>s+=actor(kinds[i],128+(slot%5)*48,133+Math.floor(slot/5)*48,['guard','archer'].includes(kinds[i])?42:50));[[501,147,'red'],[551,188,'blue'],[595,143,'yellow'],[486,245,'red'],[613,239,'yellow'],[654,184,'blue'],[553,268,'red']].forEach(([x,y,k],i)=>s+=actor(k,x,y,32,100-i*8));return s+'<span class="shot" style="left:351px;top:153px"></span><span class="shot" style="left:365px;top:234px;transform:rotate(8deg)"></span>'}
function controls(){return `<div class="controls"><button aria-label="일시정지">${icons.pause}<small>정지</small></button><button class="speed" aria-label="배속 변경"><b>1×</b><small>배속</small></button><button disabled aria-label="설정 준비중">${icons.settings}<small>설정</small></button><button aria-label="로비 복귀">${icons.home}<small>복귀</small></button></div>`}
function commands(){return `<nav class="commands">${[['soldier','병사'],['hero','영웅'],['shop','상점'],['formation','진형'],['bag','가방']].map(([k,t])=>`<button aria-label="${t}">${icons[k]}<span>${t}</span></button>`).join('')}</nav>`}

const iconPaths={
 soldier:'M12 3v18M4 8l8-5 8 5-8 13Z',
 hero:'m3 7 4 4 5-7 5 7 4-4-3 13H6Z',
 shop:'M4 9h16v12H4ZM3 9l3-6h12l3 6M8 13h3v8m4-8h2',
 formation:'M4 4h5v5H4Zm11 0h5v5h-5ZM4 15h5v5H4Zm11 0h5v5h-5Z',
 bag:'M5 8h14v13H5ZM9 8V4h6v4m-6 5h6v4H9Z',
 pause:'M7 4v16M17 4v16', settings:'M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-6 0v6',
 home:'m3 11 9-8 9 8M6 9v12h12V9m-8 12v-7h4v7'
};
const solidPaths={
soldier:'M11 2h2l2 13h4v3h-5v4h-4v-4H5v-3h4Z',
hero:'m2 7 5 4 5-8 5 8 5-4-3 14H5Zm5 16h10v-2H7Z',
shop:'M3 8 6 2h12l3 6v3H3Zm2 5h14v9h-6v-6h-3v6H5Z',
formation:'M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z',
bag:'M8 2h8l2 6h3l1 14H2L3 8h3Zm2 3L9 8h6l-1-3ZM9 12v5h6v-5Z',
pause:'M5 3h5v18H5Zm9 0h5v18h-5Z',
settings:'M3 4h18v3H3Zm0 7h18v3H3Zm0 7h18v3H3ZM6 2h4v7H6Zm8 7h4v7h-4Zm-6 7h4v7H8Z',
home:'m1 11 11-9 11 9-3 1v10h-6v-7h-4v7H4V12Z'
};
const etched={...icons};
function applyIcons(d){for(const k of Object.keys(icons)) icons[k]=d===2?etched[k]:svg('<path d="'+(d===1?solidPaths[k]:iconPaths[k])+'"/>')}

stage.innerHTML='<h1 class="board-title">공통 버튼 3종 · 확대 비교</h1><p class="intro">동일 기능과 48px 터치 영역 / 새 배경 3종에 스킨 그대로 적용 / 실제 게임 반영 전 시안</p><div class="columns"></div>';
const descriptions=['판금 모서리 절삭 · 얇은 은색 테두리<br>불투명 무광 표면 / 실루엣 아이콘','청동 주조 테두리 · 이중 단차 프레임<br>깊은 음각 판 / 정교한 선화 아이콘','라운드 캡슐 · 얇은 유리 외곽선<br>반투명 차콜 / 간결한 선 아이콘'];
for(let d=1;d<=3;d++){applyIcons(d);let html='<section class="sample d'+d+'"><h2>'+designs[d-1]+'</h2><p>'+descriptions[d-1]+'</p>';for(const [label,cls] of [['기본',''],['선택','selected'],['강조','primary'],['비활성','disabled']])html+='<div class="sample-row"><span>'+label+'</span><button '+(cls==='disabled'?'disabled':'class="'+cls+'"')+'>'+icons.bag+'<span>가방</span></button></div>';html+='<div class="icon-row">'+['soldier','hero','shop','formation','bag','pause','settings','home'].map(k=>'<button aria-label="'+k+'">'+icons[k]+'</button>').join('')+'</div><div class="legend">병사 · 영웅 · 상점 · 진형<br>가방 · 정지 · 설정 · 복귀</div></section>';stage.querySelector('.columns').insertAdjacentHTML('beforeend',html)}
stage.insertAdjacentHTML('beforeend','<p class="board-note">선택: D1 왼쪽 표시선 / D2 안쪽 이중선·눌린 음영 / D3 밝은 면·안쪽 윤곽. 비활성은 실제 기본 화면의 준비 중 설정에 적용.<br>확대 비교판의 선택·강조 상태는 시각 규칙 제안이며, 새 게임 기능이나 구매·장비 상태를 확정하지 않습니다.</p>');
stage.style.transform='scale('+innerWidth/800+')';window.onresize=()=>stage.style.transform='scale('+innerWidth/800+')';
</script></body></html>
