lass="viewer" id="viewer"><div class="toolbar"><button class="control" id="prev">← 이전</button><button class="control" id="next">다음 →</button><h2 id="vtitle"></h2><button class="control" id="native">800px 실제 배율</button><a id="original" target="_blank">원본 PNG</a><button class="control" id="close">닫기 ×</button></div><img class="large" id="large" alt="화면 전체"></div><script>const data=[{"n": 1, "file": "01-normal-equipment.png", "title": "평상시 장비 정비", "desc": "차수7 · 4건 세부 보완"}, {"n": 2, "file": "02-item-codex.png", "title": "아이템 도감", "desc": "차수7 · 4건 세부 보완"}, {"n": 3, "file": "03-combination.png", "title": "장비 조합", "desc": "차수7 · 4건 세부 보완"}, {"n": 4, "file": "04-deployment-ranks.png", "title": "전·중·후열 배치", "desc": "차수7 · 4건 세부 보완"}, {"n": 5, "file": "05-pre-midboss.png", "title": "중보스 직전 정비", "desc": "차수7 · 4건 세부 보완"}, {"n": 6, "file": "06-enemy-info.png", "title": "적 정보", "desc": "차수7 · 4건 세부 보완"}];let index=0;const $=id=>document.getElementById(id);function show(i){index=(i+data.length)%data.length;const d=data[index];$('large').src=d.file;$('original').href=d.file;$('vtitle').textContent=String(d.n).padStart(2,'0')+' '+d.title;$('viewer').classList.add('open')}data.forEach((d,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML='<img src="'+d.file+'" alt="'+d.title+'"><h2>'+String(d.n).padStart(2,'0')+' '+d.title+'</h2><p>'+d.desc+'</p>';b.onclick=()=>show(i);$(i<6?'core':'extra').append(b)});$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('close').onclick=()=>$('viewer').classList.remove('open');$('native').onclick=()=>$('viewer').classList.toggle('native');document.onkeydown=e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)};</script></body></html>
