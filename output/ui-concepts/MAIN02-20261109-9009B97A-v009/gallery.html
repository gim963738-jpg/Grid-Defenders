<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3 차수9 · 정지 정비 정보</title><style>*{box-sizing:border-box}body{margin:0;background:#10242f;color:#edf3ec;font:15px 'Malgun Gothic',sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.65;color:#c1d4d3}a{color:#d5ecc7}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{padding:0;border:1px solid #99b5ae88;border-radius:16px;overflow:hidden;color:#edf3ec;background:#1a343c;cursor:pointer;text-align:left}.tile img{width:100%;display:block}.tile h2{font-size:17px;margin:12px}.tile p{font-size:13px;margin:0 12px 12px}.viewer{position:fixed;inset:0;background:#08141af5;z-index:9;display:none;overflow:auto;padding:12px}.viewer.open{display:block}.toolbar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:8px;background:#18343bef;border-radius:12px;margin-bottom:8px}.toolbar h2{font-size:17px;flex:1;margin:0}button.control,.toolbar a{min-width:48px;min-height:48px;border:1px solid #b8d2c9;border-radius:12px;background:#26494c;color:#eef5ec;font:700 14px 'Malgun Gothic',sans-serif;padding:12px;text-decoration:none}.viewer .large{display:block;width:min(100%,1600px);height:auto;margin:0 auto}.viewer.native .large{width:800px;max-width:none}.section-title{font-size:22px;margin-top:32px}.guide{background:#19383d;padding:14px 18px;border-radius:14px}.guide b{color:#e4f3cb}@media(max-width:850px){.cards{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}</style><body><main><h1>D3 차수9 · 정지 정비의 정보와 설명</h1><ol><li style="color:#a6dea6">완료 — 신규6장 제작·자체검증 (이번 보고)</li><li>사용자 평가 대기 — 정보 위계·크기·배치</li></ol><p>상시 핵심 정보 + 탭하여 긴 설명 한 카드 · 병사1 / 영웅4 슬롯 · 전체 능력치 + 스킬 · 요청한 아이템 비교</p><nav><a href="전체6-비교판.png">신규6 전체 비교판</a><a href="결과보고.md">결과보고</a><a href="concepts.html">선택·열람 목업</a><a href="../MAIN02-20261109-9009B97A-v008/gallery.html">기존 v008 전체 흐름</a></nav><div class="cards" id="core"></div><h2 class="section-title">기존 전체 흐름의 참조 화면</h2><p>아래3장은 v008 읽기 전용 원본이며 신규6장으로 세지 않습니다. 적 정보는 중보스 구간 직전 정비에만 접근합니다.</p><div class="cards" id="refs"></div></main><div class="viewer" id="viewer"><div class="toolbar"><button class="control" id="prev">← 이전</button><button class="control" id="next">다음 →</button><h2 id="vtitle"></h2><button class="control" id="native">800px 실제 배율</button><a id="original" target="_blank">원본 PNG</a><button class="control" id="close">닫기 ×</button></div><img class="large" id="large" alt="화면 전체"></div><script>const data=[{"n": 1, "file": "01-soldier-summary.png", "title": "병사 선택 · 핵심 정보", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": 2, "file": "02-hero-summary.png", "title": "영웅 선택 · 스킬 4개", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": 3, "file": "03-skill-description.png", "title": "스킬 설명 · 한 카드", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": 4, "file": "04-full-stats-skills.png", "title": "전체 능력치와 스킬", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": 5, "file": "05-item-information.png", "title": "아이템 정보 조회", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": 6, "file": "06-item-comparison.png", "title": "선택 아이템 비교", "desc": "차수9 신규 · 정지 정비 UI"}, {"n": "참조", "file": "../MAIN02-20261109-9009B97A-v008/02-equipment-idle.png", "title": "장비 기본 · 3열54셀/직접조합", "desc": "기존 v008 원본 · 이번 신규 제작에 미포함"}, {"n": "참조", "file": "../MAIN02-20261109-9009B97A-v008/01-codex-large.png", "title": "도감 · 큰 이미지 뒤 점유 블록", "desc": "기존 v008 원본 · 이번 신규 제작에 미포함"}, {"n": "참조", "file": "../MAIN02-20261109-9009B97A-v008/07-enemy-list.png", "title": "중보스 직전 적 정보 · 좌목록 우상세", "desc": "기존 v008 원본 · 이번 신규 제작에 미포함"}];let index=0;const $=id=>document.getElementById(id);function show(i){index=(i+data.length)%data.length;const d=data[index];$('large').src=d.file;$('original').href=d.file;$('vtitle').textContent=String(d.n).padStart(2,'0')+' '+d.title;$('viewer').classList.add('open')}data.forEach((d,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML='<img src="'+d.file+'" alt="'+d.title+'"><h2>'+String(d.n).padStart(2,'0')+' '+d.title+'</h2><p>'+d.desc+'</p>';b.onclick=()=>show(i);$(i<6?'core':'refs').append(b)});$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('close').onclick=()=>$('viewer').classList.remove('open');$('native').onclick=()=>$('viewer').classList.toggle('native');document.onkeydown=e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)};</script></body></html>
