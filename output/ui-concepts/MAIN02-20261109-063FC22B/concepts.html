function grid(cols,rows,type='bag'){let s=`<div class="grid" style="width:${cols*48}px;height:${rows*48}px;grid-template-columns:repeat(${cols},48px)">${Array.from({length:cols*rows},()=>'<div class="cell"></div>').join('')}`;const items=type==='bag'?[[0,0,2,0],[3,0,2,1],[0,2,2,2],[5,1,1,4],[3,2,2,0]]:[[0,0,2,0],[3,0,2,1],[0,2,2,2]];for(const[x,y,w,i]of items)s+=`<div class="gear" style="left:${x*48}px;top:${y*48}px;width:${w*48}px;height:48px">${gearArt(i)}</div>`;return s+'</div>'}
function shopStrip(){return `<div class="offerstrip">${['철검','수호 방패','가속 룬','활력 수정','황금 주머니'].map((n,i)=>`<button class="offer ${i===0?'selected':''}">${gearArt(i)}<span>${n}</span><b>${[60,60,70,60,100][i]}G</b></button>`).join('')}<button class="reroll">↻<br>새로고침<br>20G</button></div>`}
function overlay(n){switch(n){case 7:return '<div class="placement-message">병사를 빈 칸으로 끌어 배치</div>'+side('타워 배치',`<div class="titleline">${art('guard')}<div><h3>보병</h3><small>고정 방어 배치 제안</small></div></div><div class="detail-row">소환 비용<b>50G</b></div><div class="detail-row">공격 / 사거리<b>26 / 130</b></div><p class="helper">기존 병사·영웅을 방어 유닛으로 표현합니다.</p>`,'<button>취소</button><button class="primary">배치 선택</button>')+`<div class="tray panel">${[['guard','보병','50G'],['archer','궁병','75G'],['mage','마법병','90G']].map(([k,t,p])=>`<button class="card">${art(k)}<span class="name">${t} · ${p}</span></button>`).join('')}</div>`;
case 8:return '<div class="range"></div>'+side('선택 타워',`<div class="titleline">${art('guard')}<div><h3>보병 Lv.1</h3><small>병사 강화 · 임시 수치</small></div></div><div class="detail-row">공격력<b>26 → 33</b></div><div class="detail-row">공격 속도<b>1.00 / 초</b></div><div class="detail-row">사거리<b>130</b></div>`,'<button>이동</button><button class="primary">강화 30G</button>');
case 9:return side('장비 선택',`<div class="titleline">${portrait('melee')}<div><h3>아리아</h3><small>영웅 1 / 3 · 장비 5×4</small></div></div><p>구매한 장비는 공용 가방으로 이동합니다.</p><div class="detail-row">보유 골드<b>480G</b></div><div class="detail-row">모루<b>2</b></div>`,'<button>장비</button><button>가방</button>')+shopStrip()+`<aside class="buytip panel"><h3>철검</h3><small>공격력 +15 · 가로 2칸</small><button class="primary">구매 60G</button></aside>`;
case 10:return side('공용 가방 · 7×3',`<small>21칸 고정 · 드래그로 이동</small>${grid(7,3)}`,'<button>장비 보기</button><button>상점으로</button>','inventory-side');
case 11:return `<section class="wide panel">${closeHeader('장비 · 조합')}<div class="equip-area"><div class="grid-title">아리아 · 장비 5×4</div>${grid(5,4,'equip')}</div><div class="bag-area"><div class="grid-title">공용 가방 · 7×3</div>${grid(7,3)}<p class="helper" style="margin-top:8px">선택 영웅 + 공용 가방의 기존 일괄 조합</p></div><div style="position:absolute;left:280px;top:138px;width:112px;text-align:center"><span style="font-size:26px;color:#c5b47f">⇄</span><p class="helper">끌어 장착<br>두 번 눌러 회전</p></div><div class="bottom-actions"><button>← 전투 복귀</button><button class="primary">일괄 조합</button><small>철검 + 철검 → 정밀 검 · 모루 소모</small></div></section>`;
case 12:return side('영웅 정보',`<div class="titleline">${portrait('melee')}<div><h3>아리아 · Lv.1</h3><small>근접 딜러 · 배치 중</small></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">${[['체력','1100'],['물리 공격','90'],['공격 속도','1.00'],['물리 방어','25'],['마법 방어','15'],['사거리','130'],['치명타','10%'],['치명 피해','150%'],['체력 재생','0/초'],['골드','+0%']].map(([k,v])=>`<div class="detail-row" style="font-size:12px;padding:5px 0">${k}<b>${v}</b></div>`).join('')}</div>`,'<button>착용 장비</button><button>스킬 상세</button>');
case 13:return side('스킬 상세',`<div class="titleline"><div class="skill-big">♜</div><div><h3>화염 기둥</h3><small>원거리 딜러 · 보스전</small></div></div><p>기본 피해 ×3<br>범위 공격</p><p class="skillnote helper">사거리 안에 대상이 있을 때 사용<br>자동 스킬 ON/OFF 지원</p>`,'<button>← 영웅 정보</button>');
case 14:return `<div class="veil"></div><section class="modal panel"><small>WAVE 09 · 정지 상태에서 배치 준비</small><h2 style="margin-top:6px">잠시 숨을 고르세요</h2><p>배치와 장비를 확인하고<br>재개하면 현재 웨이브가 이어집니다.</p><div class="row"><button>병사 배치</button><button>장비 확인</button></div><button class="primary">▶ 전투 재개</button><div class="row"><button>1× 배속</button><button disabled>설정 준비중</button><button>로비 복귀</button></div></section>`;
case 15:return `<div class="formatlabel panel"><span style="padding-left:12px">↑ 보스 방향 · 7×6</span><button class="close">×</button></div><div class="form-grid grid">${Array.from({length:42},(_,i)=>`<div class="cell">${({3:'guard',9:'guard',17:'melee',18:'ranged',24:'blond',31:'archer',38:'archer'})[i]?art(({3:'guard',9:'guard',17:'melee',18:'ranged',24:'blond',31:'archer',38:'archer'})[i]):''}</div>`).join('')}</div><aside class="form-desc panel"><small>편집 중 전투 정지</small><h2 style="margin-top:8px">보스전 진형</h2><p>전열 · 보병 / 중열 · 영웅<br>후열 · 궁병과 마법병</p><p class="helper">영웅은 중열 2행에만 배치<br>선택 후 빈칸 이동 · 유닛 교환<br>저장 진형은 다음 보스전에 적용</p><div class="row"><button>자동배치</button><button class="primary">완료</button></div></aside>`;
case 16:return side('아군 상태 · 스킬',`<div class="allies">${[['melee','아리아','78%','연속 검격 · 준비'],['ranged','카이','64%','화염 기둥 · 3.2초'],['blond','금발 전사','92%','스킬 미부여']].map(([k,t,hp,sk])=>`<div class="unitline">${portrait(k)}<div><b>${t} <small>${hp}</small></b><div class="bar"><i style="width:${hp}"></i></div><small>${sk}</small></div></div>`).join('')}</div>`,'<button class="primary">자동 스킬 ON</button>');
default:return ''}}
window.render=(n=1)=>{n=Number(n);const plan=n<=2?'A':n<=4?'B':n<=6?'C':'A';const boss=[2,4,6,13,15,16].includes(n);stage.dataset.number=n;stage.className=`stage ${plan} ${boss?'boss':''}`;let s='<div class="terrain"></div><div class="vignette"></div>';s+=boss?bossScene():waveScene();if(boss){s+='<div class="bossclock panel"><strong>00:42</strong><small>제한 60초</small></div><div class="bossbar"><header><b>시험 보스</b><span>3,840 / 6,000</span></header><div class="bar"><i></i></div></div>'+controls(true);if(![13,15,16].includes(n))s+=heroHud()+'<nav class="boss-menu"><button>진형</button><button>아군</button></nav>';s+='<div class="infochip" style="top:66px">이동 전투 · 전열 / 중열 / 후열</div>'}else{s+='<div class="top"><section class="wave panel"><small>WAVE</small><strong>09</strong></section><section class="time panel"><small>남은 시간</small><b>00:18</b></section><section class="wallet panel">◈ 480G<br>모루 2</section></div>'+controls();if(n<=6)s+=dock();s+='<div class="deflabel">방어 배치 · 5×4</div><div class="enemycount">누적 몬스터 7 / 20</div><div class="arrival"><b>←</b>적 진입</div>'}if(n<=6)s+=`<div class="scene-tag">GRID DEFENDERS · ${plan==='A'?'GILDED COMMAND':plan==='B'?'FIELD JOURNAL':'VERDANT TACTICS'}</div>`;s+=overlay(n);if(n!==11&&n!==15)s+=`<div class="stamp">${String(n).padStart(2,'0')} · ${plan} · ${n>=7?'대표 비교 제안':'디자인 비교안'}</div>`;stage.innerHTML=s;stage.style.transform=`scale(${innerWidth/800})`;document.title=`${String(n).padStart(2,'0')} ${titles[n]} | Grid Defenders`;window.currentConcept=n;};window.onresize=()=>stage.style.transform=`scale(${innerWidth/800})`;render(new URLSearchParams(location.search).get('n')||1);
</script></body></html>
