<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3 차수6 · 장비와 전장</title><style>*{box-sizing:border-box}body{margin:0;background:#10242f;color:#edf3ec;font:15px 'Malgun Gothic',sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.65;color:#c1d4d3}a{color:#d5ecc7}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{padding:0;border:1px solid #99b5ae88;border-radius:16px;overflow:hidden;color:#edf3ec;background:#1a343c;cursor:pointer;text-align:left}.tile img{width:100%;display:block}.tile h2{font-size:17px;margin:12px}.tile p{font-size:13px;margin:0 12px 12px}.viewer{position:fixed;inset:0;background:#08141af5;z-index:9;display:none;overflow:auto;padding:12px}.viewer.open{display:block}.toolbar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:8px;background:#18343bef;border-radius:12px;margin-bottom:8px}.toolbar h2{font-size:17px;flex:1;margin:0}button.control,.toolbar a{min-width:48px;min-height:48px;border:1px solid #b8d2c9;border-radius:12px;background:#26494c;color:#eef5ec;font:700 14px 'Malgun Gothic',sans-serif;padding:12px;text-decoration:none}.viewer .large{display:block;width:min(100%,1600px);height:auto;margin:0 auto}.viewer.native .large{width:800px;max-width:none}.section-title{font-size:22px;margin-top:32px}.guide{background:#19383d;padding:14px 18px;border-radius:14px}.guide b{color:#e4f3cb}@media(max-width:850px){.cards{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}</style><body><main><h1>D3 · 장비 3열과 전장</h1><p>차수6 · 상점 → 영웅 → 창고 / 필수6장 + 영웅후보 보조1장<br>제작·자체검수 완료, 사용자 최종 판정 전</p><nav><a href="전체6-비교판.png">전체6 비교판</a><a href="결과보고.md">결과보고</a><a href="concepts.html">독립 시안</a></nav><h2 class="section-title">필수 화면 6장</h2><div class="cards" id="core"></div><h2 class="section-title">영웅 후보 · 보조</h2><div class="cards" id="extra"></div></main><div class="viewer" id="viewer"><div class="toolbar"><button class="control" id="prev">← 이전</button><button class="control" id="next">다음 →</button><h2 id="vtitle"></h2><button class="control" id="native">800px 실제 배율</button><a id="original" target="_blank">원본 PNG</a><button class="control" id="close">닫기 ×</button></div><img class="large" id="large" alt="화면 전체"></div><script>const data=[{"n": 1, "file": "01-equipment-base.png", "title": "장비 정비", "desc": "필수 화면"}, {"n": 2, "file": "02-purchase-target.png", "title": "상품 선택 · 구매 목적지", "desc": "필수 화면"}, {"n": 3, "file": "03-equipment-transfer.png", "title": "영웅 → 창고 이동", "desc": "필수 화면"}, {"n": 4, "file": "04-field-deployment.png", "title": "병력 배치", "desc": "필수 화면"}, {"n": 5, "file": "05-hero-detail.png", "title": "영웅 선택 상세", "desc": "필수 화면"}, {"n": 6, "file": "06-auto-battle.png", "title": "자동 전투", "desc": "필수 화면"}, {"n": 7, "file": "07-hero-page2.png", "title": "영웅 후보 두번째 페이지", "desc": "영웅 탐색 보조 1장"}];let index=0;const $=id=>document.getElementById(id);function show(i){index=(i+data.length)%data.length;const d=data[index];$('large').src=d.file;$('original').href=d.file;$('vtitle').textContent=String(d.n).padStart(2,'0')+' '+d.title;$('viewer').classList.add('open')}data.forEach((d,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML='<img src="'+d.file+'" alt="'+d.title+'"><h2>'+String(d.n).padStart(2,'0')+' '+d.title+'</h2><p>'+d.desc+'</p>';b.onclick=()=>show(i);$(i<6?'core':'extra').append(b)});$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('close').onclick=()=>$('viewer').classList.remove('open');$('native').onclick=()=>$('viewer').classList.toggle('native');document.onkeydown=e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)};</script></body></html>
