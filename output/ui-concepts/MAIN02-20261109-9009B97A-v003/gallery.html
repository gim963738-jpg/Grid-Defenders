<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3 · 병사 / 영웅 / 상점 / 진형</title><style>
*{box-sizing:border-box}body{margin:0;background:#10212b;color:#edf1e8;font:14px/1.6 'Malgun Gothic',sans-serif}header,main,footer{max-width:1600px;margin:auto;padding:24px}header{padding-top:36px}h1{font-size:32px;line-height:1.4;margin:8px 0}header small{font-size:12px;letter-spacing:3px;color:#b6d2c9}p{max-width:1020px;color:#b8ccc9}a{color:#d4e9d6;text-decoration:none}.links{display:flex;gap:8px;flex-wrap:wrap}button,.links a,.caption a{min-height:48px;min-width:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;font:700 14px 'Malgun Gothic',sans-serif;border-radius:16px;border:1px solid #bed3ca78;background:#233d45;color:#f0f4ec;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border-radius:20px;background:linear-gradient(140deg,#243c45,#182b34);border:1px solid #bdd3c94d;overflow:hidden}.card>button{display:block;width:100%;padding:0;border:0;border-radius:0;line-height:0}.card img{width:100%;aspect-ratio:20/9;object-fit:contain}.caption{padding:16px}.caption h2{margin:0;font-size:20px}.caption p{margin:4px 0 14px;min-height:42px}.caption small{font-size:12px;color:#bdd8ce}.caption a{margin-right:8px}footer{color:#abc4bf;font-size:12px}dialog{width:min(96vw,2200px);max-width:none;background:#10232c;color:#f2f4e9;border:1px solid #acc9bf;border-radius:18px;padding:12px;max-height:96vh}dialog::backdrop{background:#06121beb}dialog img{width:100%;max-height:78vh;object-fit:contain;display:block}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.bar h2{font-size:20px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{display:flex;align-items:center;padding:10px;min-height:48px}@media(max-width:760px){.grid{grid-template-columns:1fr}header,main,footer{padding:16px}h1{font-size:26px}}
</style><body><header><small>GRID DEFENDERS · D3 GLASS</small><h1>선택한 D3, 안쪽 구성까지</h1><p>상단 정보판의 배경을 조금 더 비치게 조정하고, 병사·영웅·상점·보스전 진형을 펼쳤습니다. 각 이미지를 눌러 확대할 수 있습니다. 수치와 배치는 기능을 보여 주는 예시이며 실제 게임에 연결한 화면은 아닙니다.</p><nav class="links"><a href="비교판-펼침4.png" target="_blank">4장 비교판</a><a href="상단정보판-전후.png" target="_blank">상단 전후 확대</a><a href="00-D3-base-after.png" target="_blank">조정 기본 화면</a><a href="결과보고.md" target="_blank">결과보고</a></nav></header><main><div class="grid" id="grid"></div></main><footer>MAIN02-20261109-9009B97A / 차수3 / ui · D3 선택 반영<br>자체 검수 후 제출하는 정적 UI 시안이며 사용자 최종 미적 합격과 게임 통합 전입니다.</footer><dialog id="viewer"><img id="large" alt=""><div class="bar"><h2 id="viewerTitle"></h2><div class="actions"><button id="previous">← 이전</button><button id="next">다음 →</button><a id="original" target="_blank">개별 PNG 열기 ↗</a><button id="close">닫기 ×</button></div></div></dialog><script>
const data=[['01-soldier','병사 · 배치와 강화','병사3종 · 소환 비용 · 보병 능력치 · 이동과 강화'],['02-hero','영웅 · 선택과 정보','영웅3명 · 현재10개 능력치 · 착용장비와 스킬 접근'],['03-shop','상점 · 상품과 구매','상품5개 · 새로고침 · 철검 구매 · 장비와 가방 접근'],['04-formation','진형 · 다음 보스전 준비','7×6 / 42칸 · 전·중·후열 · 자동배치와 완료']];
grid.innerHTML=data.map(([f,t,p],i)=>`<article class="card"><button data-view="${i}" aria-label="${t} 크게 보기"><img src="${f}.png" alt="${t}"></button><div class="caption"><small>0${i+1} / D3 설산</small><h2>${t}</h2><p>${p}</p><a href="${f}.png" target="_blank">개별 PNG 열기 ↗</a></div></article>`).join('');let current=0;function show(i){current=(i+4)%4;const[f,t]=data[current];large.src=f+'.png';large.alt=t;viewerTitle.textContent='0'+(current+1)+' · '+t;original.href=f+'.png';if(!viewer.open)viewer.showModal()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(Number(b.dataset.view)));previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.getElementById('close').onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(viewer.open&&e.key==='ArrowLeft')show(current-1);if(viewer.open&&e.key==='ArrowRight')show(current+1)});
</script></body></html>
