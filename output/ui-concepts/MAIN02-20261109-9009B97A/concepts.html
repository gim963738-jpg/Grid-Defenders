<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Defenders · 3테마9안</title><link rel="stylesheet" href="../../../게임/src/mobile-ui.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102426;color:#f0ead8;font-family:'Malgun Gothic',sans-serif}.stage{width:800px;height:360px;position:relative;transform-origin:0 0;overflow:hidden;background:#5c6053}.terrain{position:absolute;inset:0;background-size:100% 100%;background-position:center}.edge{position:absolute;inset:0;box-shadow:inset 0 0 25px #111a1938;pointer-events:none}.panel{background:linear-gradient(135deg,#1c3838ed,#11272cf0);border:1px solid #a49062;border-radius:13px;box-shadow:inset 0 1px #c5c6aa33,0 4px 10px #071d234a}.hud{position:absolute;left:12px;top:8px;display:flex;gap:8px;height:48px}.hud section{height:48px;padding:5px 12px;display:flex;align-items:center;gap:10px}.hud .wave{width:104px;border-radius:24px}.wave small{font-size:12px;letter-spacing:1px;color:#c5d5c9}.wave b{font-size:22px;color:#eed59d}.clock{width:88px;display:block!important;text-align:center;padding:3px 8px!important}.clock small{font-size:12px;display:block;color:#baccc0}.clock b{font-size:18px;display:block;line-height:22px}.wallet{width:112px;display:block!important;padding:4px 10px!important}.wallet div{display:flex;justify-content:space-between;font-size:14px;line-height:19px}.wallet small{font-size:12px;color:#bdcbbb}.wallet b{font-size:14px;color:#e9cd8d}.enemy-status{position:absolute;left:420px;top:8px;height:48px;width:128px;padding:5px 10px}.enemy-status small{display:block;font-size:12px;color:#c1cfc2}.enemy-status strong{font-size:16px;line-height:22px}.enemy-status em{font-style:normal;color:#e4c78e}.controls{position:absolute;right:12px;top:8px;display:flex;gap:8px}button{min-width:48px;min-height:48px;font-family:inherit;touch-action:manipulation;border:1px solid #b19b70;border-radius:12px;background:linear-gradient(145deg,#355a56f5,#1b383bf7);color:#f1ecd9;box-shadow:inset 0 1px #d1d7bd40,0 3px 8px #07181e66;font-size:14px;font-weight:700;padding:4px}.controls button{width:48px;height:48px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0}.controls svg{width:22px;height:22px;stroke:#f0e3be;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.controls small{font-size:12px;line-height:16px}.controls .speed b{font-size:19px;line-height:22px}.controls button:disabled{background:#283b3ce8;border-color:#81928b;color:#b2bbb1;box-shadow:inset 0 1px #bec4b329}.controls button:disabled svg{stroke:#aab5a9}.commands{position:absolute;right:12px;top:76px;display:grid;gap:8px}.commands button{width:84px;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 5px;position:relative}.commands button:before{content:'';position:absolute;left:10px;right:10px;top:2px;height:1px;background:linear-gradient(90deg,transparent,#b5a67f50,transparent)}.commands svg{width:22px;height:26px;flex:none;stroke:#d5bc82;fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.commands span{font-size:14px}.deflabel{position:absolute;left:104px;top:70px;font-size:12px;line-height:18px;color:#f4ecd3;text-shadow:0 1px 3px #07191c}.slots{position:absolute;left:104px;top:92px;display:grid;grid-template-columns:repeat(5,48px);grid-template-rows:repeat(4,48px);width:240px;height:192px}.slot{border:1px solid #dce7c934;background:#31504712;border-radius:3px;position:relative}.pedestal{position:absolute;bottom:4px;left:8px;width:32px;height:11px;border-radius:50%;background:linear-gradient(#9cae9c,#3e6358);border:1px solid #c1ccaa9c;box-shadow:0 2px 2px #122c2780}.actor{position:absolute;width:48px;filter:drop-shadow(0 3px 2px #071719aa);pointer-events:none}.actor>img,.actor>svg{display:block;object-fit:contain;overflow:hidden}.hp{position:absolute;left:8px;top:-7px;width:32px;height:4px;background:#2e2729;border:1px solid #20332c;border-radius:3px;overflow:hidden}.hp i{display:block;height:100%;background:#99d3ad}.monster .hp i{background:#e8a47e}.arrival{position:absolute;left:606px;top:77px;width:78px;padding:3px 7px;border-radius:12px;background:#172b2cb5;text-align:center;color:#f4e2c1;font-size:12px;text-shadow:0 1px 2px #000}.arrival b{font-size:18px;margin-right:3px}.number{position:absolute;left:12px;bottom:12px;width:34px;height:34px;display:grid;place-items:center;border:1px solid #c4ae77;border-radius:9px;background:#173235e8;color:#eddaaa;font-size:16px;font-weight:700}.concept-title{position:absolute;left:56px;bottom:12px;text-shadow:0 1px 5px #081b1c}.concept-title small{display:block;font-size:12px;line-height:17px;color:#e3ddbf}.concept-title h1{font-size:20px;margin:0;line-height:25px;color:#fff4d5;font-weight:700;letter-spacing:-.5px}.proposal{position:absolute;right:110px;bottom:12px;font-size:12px;color:#d9e1cf;text-shadow:0 1px 3px #0b1a1b;line-height:18px}.shot{position:absolute;height:2px;width:60px;background:linear-gradient(90deg,transparent,#ffe9b3);box-shadow:0 0 3px #f5ce7933;transform:rotate(-5deg)}.demon .slots{background:#a1acc111}.demon .slot{border-color:#d4dbe545}.demon .actor{filter:drop-shadow(0 2px 2px #020810) drop-shadow(0 0 1px #cae0df88)}
.concept-title{left:50px;bottom:10px;padding:2px 12px 2px 8px;border-radius:5px;background:linear-gradient(90deg,#102c2ac9,#102c2a35)}.proposal{background:#12302aa6;border-radius:5px;padding:3px 8px;right:108px;bottom:8px}</style><body><main id="stage" class="stage"></main><script>
const entries=[['01','전쟁터','무너진 성문의 방어선','01-war-gate'],['02','전쟁터','참호 너머의 공성전','02-war-trench'],['03','전쟁터','잿빛 요새의 잔광','03-war-citadel'],['04','햇빛 드는 모험 숲','황금 잎새의 원정길','04-forest-golden'],['05','햇빛 드는 모험 숲','수정 개울의 쉼터','05-forest-creek'],['06','햇빛 드는 모험 숲','고목 아래 잠든 유적','06-forest-oak'],['07','마계','흑요 균열의 경계','07-demon-fissure'],['08','마계','기형 숲의 보랏빛 숨결','08-demon-grove'],['09','마계','망각의 성채 진입로','09-demon-fortress']];
const assets='../../../게임/public/assets/';
const paths={guard:'soldiers/guard-idle-v1.png',archer:'soldiers/archer-idle-v1.png',mage:'heroes/ranged-idle.png',melee:'heroes/melee-idle.png',ranged:'heroes/ranged-idle.png',red:'monsters/slimes-v1/idle-red.png',blue:'monsters/slimes-v1/idle-blue.png',yellow:'monsters/slimes-v1/idle-yellow.png'};
const image=(kind,h=44)=>['red','blue','yellow'].includes(kind)?`<svg width="48" height="${h}" viewBox="0 0 128 128"><svg width="128" height="128" viewBox="768 0 128 128" overflow="hidden"><image href="${assets+paths[kind]}" width="1024" height="128"/></svg></svg>`:`<img src="${assets+paths[kind]}" width="48" height="${h}" alt="${kind}">`;
function actor(k,x,y,h,hp=100){return `<div class="actor ${['red','blue','yellow'].includes(k)?'monster':'ally'}" style="left:${x-24}px;top:${y-h}px;height:${h}px">${image(k,h)}<span class="hp"><i style="width:${hp}%"></i></span></div>`}
const svg=(path)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
const icons={soldier:svg('<path d="m5 20 14-16 1 1L7 21M4 15l6 5M2 22l4-4"/>'),hero:svg('<path d="M6 21v-7a6 6 0 0 1 12 0v7M6 15h12M9 8V5l3-2 3 2v3M10 16v5m4-5v5M4 21h16"/>'),shop:svg('<path d="m7 8 3-5h4l3 5M7 8q-5 8-3 11 1 3 8 3t8-3q2-3-3-11ZM8 9h8M12 12v6m2-5h-3a1 1 0 0 0 0 2h2a1 1 0 0 1 0 2h-3"/>'),formation:svg('<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18m6-18v18M3 9h18M3 15h18"/>'),bag:svg('<path d="M5 8h14l2 13H3ZM8 8V5a4 4 0 0 1 8 0v3M3 12h18m-12 0v5h6v-5"/>'),pause:svg('<path d="M8 4v16M16 4v16"/>'),settings:svg('<path d="m10 2 4 0 1 4 4 1 3 3-3 3-1 4-4 1-2 4-3-3-4-1-1-4-3-2 3-3 1-4 4-1Z"/><circle cx="12" cy="12" r="3"/>'),home:svg('<path d="m3 11 9-8 9 8M5 9v12h14V9M10 21v-7h4v7"/>')};
function scene(){let s='<div class="slots">';for(let i=0;i<20;i++)s+=`<div class="slot">${[1,3,6,8,11,13,16,18].includes(i)?'<span class="pedestal"></span>':''}</div>`;s+='</div>';const kinds=['archer','guard','ranged','guard','archer','melee','mage','guard'];[1,3,6,8,11,13,16,18].forEach((slot,i)=>s+=actor(kinds[i],128+(slot%5)*48,133+Math.floor(slot/5)*48,['guard','archer'].includes(kinds[i])?42:50));[[501,147,'red'],[551,188,'blue'],[595,143,'yellow'],[486,245,'red'],[613,239,'yellow'],[654,184,'blue'],[553,268,'red']].forEach(([x,y,k],i)=>s+=actor(k,x,y,32,100-i*8));return s+'<span class="shot" style="left:351px;top:153px"></span><span class="shot" style="left:365px;top:234px;transform:rotate(8deg)"></span>'}
function controls(){return `<div class="controls"><button aria-label="일시정지">${icons.pause}<small>정지</small></button><button class="speed" aria-label="배속 변경"><b>1×</b><small>배속</small></button><button disabled aria-label="설정 준비중">${icons.settings}<small>설정</small></button><button aria-label="로비 복귀">${icons.home}<small>복귀</small></button></div>`}
function commands(){return `<nav class="commands">${[['soldier','병사'],['hero','영웅'],['shop','상점'],['formation','진형'],['bag','가방']].map(([k,t])=>`<button aria-label="${t}">${icons[k]}<span>${t}</span></button>`).join('')}</nav>`}
window.render=(n=1)=>{n=Number(n);const e=entries[n-1];stage.dataset.number=n;stage.className='stage'+(n>=7?' demon':'');stage.innerHTML=`<div class="terrain" style="background-image:url('backgrounds/${e[3]}.png')"></div><div class="edge"></div>${scene()}<div class="hud"><section class="wave panel"><small>WAVE</small><b>09</b></section><section class="clock panel"><small>남은 시간</small><b>00:18</b></section><section class="wallet panel"><div><small>골드</small><b>480G</b></div><div><small>모루</small><b>2</b></div></section></div><section class="enemy-status panel"><small>누적 몬스터</small><strong><em>7</em> / 20</strong></section>${controls()}${commands()}<div class="deflabel">방어 배치 · 5×4</div><div class="arrival"><b>←</b>적 진입</div><div class="number">${e[0]}</div><div class="concept-title"><small>${e[1]} · ${((n-1)%3)+1}안</small><h1>${e[2]}</h1></div><div class="proposal">GRID DEFENDERS<br>전투 UI 비교 제안</div>`;stage.style.transform=`scale(${innerWidth/800})`;document.title=e[0]+' '+e[1]+' · '+e[2];};window.onresize=()=>stage.style.transform=`scale(${innerWidth/800})`;render(new URLSearchParams(location.search).get('n')||1);
</script></body></html>
