<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;margin:10px}.frame{background:#fff;display:inline-block}.frame img{width:380px;display:block}button{padding:8px}.crop{width:500px;height:450px;overflow:hidden;position:relative;background:white}.crop img{position:absolute;width:2048px;max-width:none}</style><p>발로르 실제 PNG · 표시 배경만 변경 · 원본 무가공</p><button onclick="bg('#fff')">흰색</button><button onclick="bg('#888')">회색</button><button onclick="view('whole')">전체</button><button onclick="view('face')">얼굴</button><button onclick="view('grip')">그립</button><button onclick="view('shield')">방패</button><button onclick="view('cloth')">망토</button><br><div class="frame" id="whole"><img src="../front.png"></div><div class="crop" id="detail" hidden><img src="../front.png"></div><script>function bg(c){document.querySelectorAll('.frame,.crop').forEach(e=>e.style.background=c)}function view(v){let w=document.getElementById('whole'),d=document.getElementById('detail');w.hidden=v!='whole';d.hidden=v=='whole';let p={face:[510,392],grip:[275,858],shield:[690,830],cloth:[245,1150]}[v];if(p){let i=d.firstElementChild;i.style.left=250-p[0]*2+'px';i.style.top=225-p[1]*2+'px'}}</script>
