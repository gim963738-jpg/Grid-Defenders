마법사들이 왕국에 정착해 세운 봉신가문. 화염마법의 대가다.","freedom":"가문 차원의 봉신 의무에 묶인다","alignment":"친왕파","kingdom_relationship":"왕국 소속 · 직접 봉신","magic":{"kind":"원소마법","element":"화염","specialty":"화염마법","description":"화염마법의 대가"},"affiliation_id":"central","membership_category":"kingdom_mage_family","founding_origin_organization_id":"magic_tower","founding_history":"마탑을 떠나 왕국에 몸을 맡긴 마법사들이 이루어낸 가문"},{"id":"caledor","name":"칼레도르 가문","faction_id":"royalist","region_id":"central","direct_vassal":true,"description":"마탑 출신 마법사들이 왕국에 정착해 세운 봉신가문. 공간마법의 대가다.","freedom":"가문 차원의 봉신 의무에 묶인다","alignment":"친왕파","kingdom_relationship":"왕국 소속 · 직접 봉신","magic":{"kind":"전승마법","element":null,"specialty":"공간마법","description":"공간마법의 대가"},"affiliation_id":"central","membership_category":"kingdom_mage_family","founding_origin_organization_id":"magic_tower","founding_history":"마탑을 떠나 왕국에 몸을 맡긴 마법사들이 이루어낸 가문"},{"id":"velsar","name":"벨사르 가문","faction_id":"nobility","region_id":"central","direct_vassal":false,"description":"마탑 출신 마법사들이 왕국에 정착해 세운 마법가문. 귀족파와 연결되며 물속성 마법의 대가다.","freedom":"구성원의 활동은 대체로 자유롭다","alignment":"귀족파","kingdom_relationship":"왕국 소속 · 귀족파 연대","magic":{"kind":"원소마법","element":"물","specialty":"물속성 마법","description":"물속성 마법의 대가"},"affiliation_id":"central","membership_category":"kingdom_mage_family","founding_origin_organization_id":"magic_tower","founding_history":"마탑을 떠나 왕국에 몸을 맡긴 마법사들이 이루어낸 가문"},{"id":"ordin","name":"오르딘 가문","faction_id":null,"region_id":"central","direct_vassal":false,"description":"마탑 출신 마법사들이 왕국에 정착해 세운 중립 마법가문. 특정 한 마법에 국한되지 않고 여러 마법을 종합적으로 잘 다룬다.","freedom":"구성원의 활동은 대체로 자유롭다","alignment":"중립","kingdom_relationship":"왕국 소속 · 중립","magic":{"kind":"종합마법","element":null,"specialty":null,"description":"특정 계열에 국한되지 않는 종합 마법"},"affiliation_id":"central","membership_category":"kingdom_mage_family","founding_origin_organization_id":"magic_tower","founding_history":"마탑을 떠나 왕국에 몸을 맡긴 마법사들이 이루어낸 가문"}],"tribes":[{"id":"harban","name":"하르반 부족","region_id":"north","diplomacy":"친외교","majority":"무투 전사","secondary":"주술사","description":"무투파가 중심이며, 독자 부족에서 넘어온 일부 주술사도 함께한다"},{"id":"urkan","name":"우르칸 부족","region_id":"north","diplomacy":"독자 노선","majority":"주술사","secondary":"무투 전사","description":"주술사가 다수를 이루며, 하르반보다 적은 규모의 무투 전사도 보유한다"}],"deities":[{"id":"erhaon","name":"에르하온","title":"창조신","worshipper":"성휘 대교회","description":"성휘 대교회가 세상을 창조하고 빛과 질서를 세운 존재로 섬기는 신"},{"id":"nahar","name":"나하르","title":"사막의 신","worshipper":"사하리드 왕국","description":"사하리드 사람들이 사막에서의 생존과 번영을 지키는 존재로 믿는 신"}],"regions":[{"id":"central","continent":"중앙대륙","name":"아스테른 제국","theme":"마법과 황제의 이중 수도","summary":"발레시온의 황제와 두 궁정 세력, 아르케리온의 독립 마탑, 왕국 소속 네 마법가문이 서로 다른 소속과 역할을 지닌다.","sections":[{"title":"황제와 두 수도","paragraphs":["아스테른 제국은 황제를 통치자로 둔 중앙 왕국이다. 큰 수도 발레시온과 작은 수도 아르케리온을 함께 두며 두 도시는 서로 다른 역할을 맡는다.","발레시온은 황궁과 중앙 행정, 귀족 정치가 모이는 대수도다. 아르케리온은 마법과 학술이 모이는 소수도이자 마법도시다."],"table_source":"capitals"},{"title":"큰 수도의 두 세력","paragraphs":["발레시온의 궁정은 친왕파와 귀족파로 나뉜다. 친왕파가 지지하는 통치자는 현재의 황제이며, 귀족파는 귀족 집단의 권한과 영향력을 중시한다."],"table_source":"factions"},{"title":"아르케리온의 독립 마탑","paragraphs":["마탑은 아르케리온에 자리한 독자 세력이다. 중앙대륙 마법사는 기본적으로 마탑 소속으로 분류하며, 왕국 소속 마법가문의 마법사는 별도로 분류한다.","에르디안·칼레도르·벨사르·오르딘 네 가문은 마탑을 떠나 왕국에 몸을 맡긴 마법사들이 이루어낸 가문이다. 이들의 마탑 출신 계보와 현재 왕국 소속은 구분한다."],"table_source":"organizations"},{"title":"왕국 소속 네 마법가문","paragraphs":["네 마법가문은 모두 왕국 소속이며 마탑 소속 마법사와 별도로 분류한다. 에르디안·칼레도르는 친왕파 봉신가문, 벨사르는 귀족파와 연결된 가문, 오르딘은 중립 가문이다.","에르디안은 원소 중 화염마법의 대가이며, 칼레도르는 공간마법의 대가다. 벨사르는 물속성 마법의 대가다. 오르딘은 특정 한 마법에 국한되지 않고 여러 마법을 종합적으로 잘 다룬다."],"table_source":"families"},{"title":"아르케리온의 충의와 자율","paragraphs":["아르케리온은 대외적으로 아스테른 제국에 충의를 바치는 마법도시로 알려져 있다. 실제 운영에서 도시와 제국은 협력 관계를 이루며 마법도시의 자율성을 유지한다. 그 안에 자리한 마탑은 독립 세력이다.","에르디안과 칼레도르 두 봉신가문에는 왕국에 대한 가문 차원의 의무가 있다. 그 두 가문을 제외한 마법사들의 활동은 대체로 자유롭다. 이 원칙에는 벨사르와 중립 오르딘 가문의 마법사도 포함된다.","마탑 소속, 왕국 소속 가문, 궁정에서의 정치적 입장, 도시의 대외적 충의, 개인 마법사의 활동 자유는 각각 구분한다."]},{"title":"성휘 대교회와 에르하온","paragraphs":["성휘 대교회는 중앙대륙의 대교회이며 창조신 에르하온을 섬긴다. 교회는 에르하온이 세상을 창조하고 빛과 질서를 세운 존재라고 가르친다.","대교회 교단은 발트레인 왕국과 아스테른 제국의 휴전을 중재했다. 서부가 오랜 전쟁에 지친 가운데 이뤄진 중재였으며, 교회는 신앙의 중심인 동시에 국가 사이의 협상을 잇는 종교 세력이다.","성휘 대교회는 성직자와 성기사로 구성된 자체 무력을 보유한다."]},{"title":"현재의 대외 관계","paragraphs":["아스테른 제국과 발트레인 왕국은 휴전을 유지하면서 이계의 적을 막기 위해 협력하고 있다. 제국 내부의 궁정 정치와 마법도시의 자율성도 이 공동 대응 속에서 함께 작동한다."]},{"title":"지역 구획","paragraphs":["중앙대륙은 중앙북부·중앙남부·중앙서부·중앙동부의 네 구역으로 구분한다. 이 경계는 대륙과 그 내부 방향 구역을 나누는 지리 기준이다."],"table_source":"divisions_central"}]},{"id":"west","continent":"서대륙","name":"발트레인 왕국","theme":"소드마스터와 오러 기사단","summary":"수많은 소드마스터를 길러온 강국. 내부 정치는 친왕파와 반왕파로 나뉘며, 오랜 전쟁을 멈추고 중앙과 함께 이계의 적에 맞선다.","sections":[{"title":"검의 역사와 국력","paragraphs":["발트레인 왕국은 역사적으로 많은 소드마스터를 배출해 온 서대륙의 왕국이다. 국력은 중앙대륙의 아스테른 제국에 못지않다.","왕국은 마법사와 대적할 수 있는 다수의 오러 사용자 기사단을 보유한다. 검과 오러를 운용하는 전통이 왕국의 중요한 군사적 기반이다."]},{"title":"왕국의 두 정치 세력","paragraphs":["발트레인 왕국 내부의 정치 세력은 국왕을 지지하는 친왕파와 국왕에 반대하는 반왕파로 나뉜다."],"table_source":"factions_west"},{"title":"긴 전쟁과 휴전","paragraphs":["발트레인 왕국은 중앙대륙과의 오랜 전쟁으로 지쳐 있었다. 성휘 대교회 교단의 중재를 거쳐 아스테른 제국과 휴전 상태로 전환했다."]},{"title":"현재의 협력","paragraphs":["현재 두 국가는 이계의 적들을 막아내기 위해 협력한다. 양국의 관계는 휴전의 유지와 공동 위협에 대한 대응을 바탕으로 한다."]},{"title":"지역 구획","paragraphs":["서대륙은 서대륙북부·서대륙남부·서대륙서부·서대륙동부의 네 구역으로 구분한다. 이 경계는 대륙과 그 내부 방향 구역을 나누는 지리 기준이다."],"table_source":"divisions_west"}]},{"id":"south","continent":"남대륙","name":"사하리드 왕국","theme":"사막에서 번영한 상인의 나라","summary":"활발한 무역과 풍부한 재정, 폭넓은 외교를 바탕으로 번영한다. 숨겨진 군사력의 전모는 대외적으로 알려져 있지 않다.","sections":[{"title":"교역과 재정","paragraphs":["사하리드 왕국은 무역이 활발한 상인의 나라다. 자체 재정 상태는 상시 양호하며, 각 대륙과의 외교도 원활한 편이다.","대외적으로 숨겨진 무력은 그 전모를 알 수 없다. 공개된 정보만으로 이 나라의 군사력을 단정하기 어렵다."]},{"title":"사막을 견딘 힘","paragraphs":["사하리드는 혹독한 사막 지형에서 살아남아 번영해 왔다. 예부터 내려온 고대마법과 정령술, 제국과 다른 검술 등 다양한 전통이 이 나라의 힘을 이룬다.","자국의 터전을 침해하는 침략과 침공을 용인하지 않는다."]},{"title":"사막신 나하르","paragraphs":["사하리드 왕국 사람들은 사막신 나하르를 믿는다. 이들은 자신들을 지키는 신이 제국의 신과는 별도로 존재한다고 여긴다.","나하르는 사막에서의 생존과 번영을 지키는 존재로 신앙된다."]},{"title":"동대륙과의 교류","paragraphs":["진월국과는 교류가 잦으며 우호 관계에 속한다. 여러 대륙과 원만한 외교를 이어가는 남부의 성격이 동부와의 교류에도 드러난다."]},{"title":"동쪽 산맥의 드워프 왕국","paragraphs":["사하리드 왕국 동쪽 산맥 지하에는 드워프의 지하왕국이 자리한다. 산맥 암벽의 석문은 지하 전당으로 이어진다.","드워프 민족은 사하리드 왕국과 교류가 잦고 탐구심이 깊다."]},{"title":"지역 구획","paragraphs":["남대륙은 남대륙북부·남대륙남부·남대륙서부·남대륙동부의 네 구역으로 구분한다. 이 경계는 대륙과 그 내부 방향 구역을 나누는 지리 기준이다."],"table_source":"divisions_south"}]},{"id":"east","continent":"동대륙","name":"진월국","theme":"검술과 무예를 지켜온 독립국","summary":"가문이 아닌 문파를 중심으로 운영하며 검법 문파 4개와 도법 문파 2개를 둔다. 독자적인 무예와 강한 자긍심을 이어오며 남부와 우호적인 교류를 맺는다.","sections":[{"title":"독자적인 나라","paragraphs":["진월국은 동양풍의 독자적인 나라다. 고유한 검술과 무술, 도법을 이어오며 자기 나라의 문화와 수련 전통을 지킨다.","사하리드 왕국과 마찬가지로 타국의 침략과 침공을 허하지 않는다. 외교는 이어가지만 다른 나라의 간섭을 달가워하지 않는다."]},{"title":"문파 중심 운영","paragraphs":["진월국은 가문이 아닌 문파를 중심으로 운영한다. 검법 문파 4개와 도법 문파 2개가 있다."],"table_source":"sects_east"},{"title":"긍지와 명예","paragraphs":["진월국은 자국의 긍지와 명예를 높이 평가한다. 이러한 태도는 외부의 간섭을 경계하고 독자성을 지키려는 성격과 맞물린다."]},{"title":"거리 있는 외교와 남부의 우호","paragraphs":["대체로 다른 나라와는 관계가 소원하고 그리 좋은 편은 아니다. 외교 자체는 원활하게 이어지지만, 친밀한 관계를 넓히는 데에는 신중하다.","그중 사하리드 왕국과는 교류가 잦아 우호적인 나라로 여긴다."]},{"title":"소규모 오염지역","paragraphs":["호수 동쪽·진월국 북쪽 내륙에 소규모 운석 오염지역 한 곳이 있다. 기존 대형 충돌지 가로폭의 약 1/4 규모이며 별도 지명을 붙이지 않는다."]},{"title":"지역 구획","paragraphs":["동대륙은 동대륙북부·동대륙남부·동대륙서부·동대륙동부의 네 구역으로 구분한다. 이 경계는 대륙과 그 내부 방향 구역을 나누는 지리 기준이다."],"table_source":"divisions_east"}],"martial_organization":{"basis":"문파","family_based":false,"sect_types":[{"discipline":"검법","count":4,"names":null},{"discipline":"도법","count":2,"names":null}]}},{"id":"north","continent":"북대륙","name":"스카르가드 요새","theme":"설산의 두 부족이 지키는 요새","summary":"혹독한 추위와 험지를 이겨낸 소수의 전사들이 두 부족의 전승과 터전을 지킨다.","sections":[{"title":"혹한 속의 요새","paragraphs":["스카르가드 요새는 거센 눈과 낮은 기온 속에서 살아남은 이들이 힘을 모아 세운 요새다. 그 구성원은 기본적으로 신체가 튼튼하며, 한 사람 한 사람이 험한 북방 지형을 견뎌낸 전사다.","다른 나라에 비해 인구는 적다. 외부로 침략과 침공을 벌이지 않으며, 자기 터전을 지키는 성격이 강하다."]},{"title":"설산에서 드러나는 전력","paragraphs":["북방의 설산에서는 한 명의 북방 전사가 일반 전사 3~4명을 상대해 이길 정도로 강력하다. 이 힘은 설산이라는 환경과 그곳에서 살아온 경험에 연결된다.","이들이 마음먹고 힘을 기울인다면 한 나라의 국력을 절반 이상 무너뜨릴 저력이 있다."]},{"title":"두 부족","paragraphs":["스카르가드 요새의 두 부족은 친외교적인 하르반과 독자 노선을 ]},"divisions_north":{"headers":["구역","방향"],"rows":[["북대륙북부","북부"],["북대륙남부","남부"],["북대륙서부","서부"],["북대륙동부","동부"]]}},"characterText":"기존 첨부자료와 이전 작업물은 모두 출신·소속 미지정으로 보관한다. 기존 아르케리온 수석 빛 마법사 시안도 포함하며 현재 세계관에 배치하지 않는다. 신규 캐릭터부터 출신과 소속을 지정한다.","namesText":"작은 마법 수도의 표준명은 아르케리온이다. 이전 제작물의 아르켈리온·하르케리온 표기는 이 도시를 가리키는 이전 표기로 보관한다.","geographyText":"중앙대륙의 큰 도시는 발레시온이며, 그 북동쪽의 작은 마법도시는 아르케리온이다. 독립 세력인 마탑은 아르케리온에 자리한다. 성휘 대교회는 발레시온의 도시 구역 안에 있다. 북서부의 거대한 이계 충돌 흔적과 오염지역, 남동부의 차원 균열은 지도에 유지한다. 사하리드 왕국 앞 해안의 녹지는 동쪽 강 하구까지 이어진다. 아르케리온 북동쪽과 동대륙 북서부 사이에는 녹지로 이어진 육지가 있으며, 그 일대에 엘프의 숲이 자리한다. 사막 내륙과 강의 주요 물길은 유지한다. 사하리드 왕국 동쪽 산맥 지하에는 드워프의 지하왕국이 있다.","mapLayoutText":"도시·왕국 삽화의 상대적인 비중을 줄이고 도시 사이의 내륙 지형과 이동 공간을 넓힌 가로형 지도다. 다섯 대륙을 각각 북부·남부·서부·동부 네 구역으로 나눈다. 기존 서대륙·중앙대륙·남대륙의 소규모 운석 오염지 3곳에 동대륙 1곳을 더해 총 4곳을 지명 없이 표시한다. 작은 충돌지는 기존 대형 충돌지 가로폭의 약 1/4이다.","easyText":"↳ 쉽게 말하면: 중앙대륙 마법사의 기본 소속은 독립 세력인 마탑이다. 마탑을 떠나 왕국에 정착한 네 가문은 별도로 분류하며, 두 봉신가문 외 마법사들의 활동 자유는 유지된다."}</script><script>
'use strict';
const world=JSON.parse(document.getElementById('world-data').textContent);
const nav=document.getElementById('region-nav'),stage=document.getElementById('map-stage'),legend=document.getElementById('legend'),panel=document.getElementById('detail');
let selectedView='central',selectedMarker=null;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function table(t){const wrap=el('div','table-wrap'),node=el('table'),head=el('thead'),hr=el('tr'),body=el('tbody');for(const title of t.headers){const th=el('th','',title);th.scope='col';hr.append(th);}head.append(hr);for(const row of t.rows){const tr=el('tr');for(const cell of row)tr.append(el('td','',cell));body.append(tr);}node.append(head,body);wrap.append(node);return wrap;}
function context(id){if(!id)return null;const cap=world.capitals.find(c=>c.id===id);if(cap)return {title:cap.name+' · '+cap.kind,text:cap.role};if(id==='great_church'){const church=world.institutions.find(i=>i.id===id);return {title:church.name,text:world.names.greatCapital+'의 대교회. 창조신 '+world.names.creator+'을 섬기며 중앙과 서부의 휴전을 중재했다. '+church.armed_force.description};}const landmark=(world.landmarks||[]).find(l=>l.id===id);if(landmark)return {title:landmark.name,text:landmark.location};return null;}
function render(view,focus){selectedView=view;selectedMarker=focus||null;panel.replaceChildren();panel.scrollTop=0;const info=context(focus);if(info){const box=el('div','context');box.append(el('strong','',info.title),el('p','',info.text));panel.append(box);}
 if(view==='relations'){
  panel.append(el('div','eyebrow','신앙과 국제 관계'),el('h2','','두 신앙과 주요 관계'),el('p','summary','대교회의 창조신 신앙과 남부의 사막신 신앙, 국가·마법도시·민족의 관계를 함께 정리했습니다.'));
  panel.append(el('h3','','두 신앙의 신'),table(world.tables.deities),el('h3','','주요 관계'),table(world.tables.relations));
 }else if(view==='landmarks'){
  panel.append(el('div','eyebrow','자연지리'),el('h2','','자연지리와 거점'));
  if(!focus&&world.mapLayoutText)panel.append(el('p','summary',world.mapLayoutText));
  if(!focus&&(world.peoples||[]).length)panel.append(el('p','summary',world.peoples_summary),table(world.tables.peoples));
  for(const landmark of (world.landmarks||[]).filter(l=>!focus||l.id===focus)){panel.append(el('h3','',landmark.name),el('p','summary',landmark.location));for(const paragraph of landmark.paragraphs)panel.append(el('p','',paragraph));const people=(world.peoples||[]).find(p=>p.id===landmark.people_id);if(people)for(const paragraph of people.paragraphs)panel.append(el('p','',paragraph));}
 }else{
  const region=world.regions.find(r=>r.id===view);panel.append(el('div','eyebrow',region.continent),el('h2','',region.name),el('p','summary',region.summary));
  for(const section of region.sections){panel.append(el('h3','',section.title));for(const p of section.paragraphs)panel.append(el('p','',p));if(section.table_source)panel.append(table(world.tables[section.table_source]));if(region.id==='central'&&section.title==='아르케리온의 충의와 자율')panel.append(el('p','easy',world.easyText));}
 }
 for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.view===view));
 for(const b of document.querySelectorAll('[data-marker]')){const marker=world.map.markers.find(m=>m.id===b.dataset.marker);b.setAttribute('aria-pressed',String(focus?marker.id===focus:view!=='relations'&&(marker.view_id||marker.region_id)===view));}
}
function select(view,focus,scroll){render(view,focus);const hash='#'+(focus||view);if(location.hash!==hash)history.replaceState(null,'',location.href.split('#')[0]+hash);if(scroll&&matchMedia('(max-width:800px)').matches)panel.scrollIntoView({behavior:'smooth',block:'start'});}
for(const region of world.regions){const b=el('button','',region.continent);b.type='button';b.dataset.view=region.id;b.addEventListener('click',()=>select(region.id,null,true));nav.append(b);}
const relations=el('button','','신앙·관계');relations.type='button';relations.dataset.view='relations';relations.addEventListener('click',()=>select('relations',null,true));nav.append(relations);
if((world.landmarks||[]).length){const b=el('button','','지리·거점');b.type='button';b.dataset.view='landmarks';b.addEventListener('click',()=>select('landmarks',null,true));nav.append(b);}
world.map.markers.forEach((m,i)=>{const action=()=>select(m.view_id||(m.id==='great_church'?'relations':m.region_id),m.id,true);const pin=el('button','pin');pin.type='button';pin.dataset.marker=m.id;pin.style.left=m.x*100+'%';pin.style.top=m.y*100+'%';pin.title=m.title+' · '+m.label;pin.setAttribute('aria-label',String(i+1)+' '+m.title+' '+m.label);pin.append(el('span','',String(i+1)));pin.addEventListener('click',action);stage.append(pin);const link=el('button');link.type='button';link.dataset.marker=m.id;link.append(el('span','num',String(i+1)),document.createTextNode(m.title));link.addEventListener('click',action);legend.append(link);});
document.getElementById('map-version').textContent='지도 v'+world.map.version+' · 설정집 v'+world.version;
document.getElementById('boundary-guide').textContent=world.map.boundary_note||'';
document.getElementById('pins-toggle').addEventListener('click',e=>{const hidden=stage.classList.toggle('hide-pins');e.currentTarget.setAttribute('aria-pressed',String(!hidden));e.currentTarget.textContent=hidden?'지도 번호 보이기':'지도 번호 숨기기';});
function restore(){const id=location.hash.slice(1),marker=world.map.markers.find(m=>m.id===id);if(marker)render(marker.view_id||(marker.id==='great_church'?'relations':marker.region_id),marker.id);else if(id==='relations'||id==='landmarks'||world.regions.some(r=>r.id===id))render(id,null);else render('central',null);}
addEventListener('hashchange',restore);restore();
</script></body></html>
