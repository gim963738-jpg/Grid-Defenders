<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세계관 지도와 설정집</title>
<style>
:root{color-scheme:light;--page:#f1eee6;--paper:#fffdf8;--ink:#29312f;--muted:#69736d;--line:#d9d2c3;--accent:#835b2a;--tint:#f3ead8}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.8 "Segoe UI","Malgun Gothic",sans-serif}main{max-width:1720px;margin:auto;padding:26px 25px 45px}h1{font-size:clamp(26px,3.5vw,38px);line-height:1.35;margin:0 0 10px}h2{font-size:26px;line-height:1.45;margin:0 0 9px}h3{font-size:18px;line-height:1.5;margin:25px 0 10px}p{margin:0 0 13px}.intro,.muted{color:var(--muted)}a{color:var(--accent);text-underline-offset:3px}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--paper);color:var(--ink)}button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid #b36d2b;outline-offset:3px}.links{display:flex;flex-wrap:wrap;gap:9px 22px;margin:15px 0 20px;font-size:13px}.region-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:22px;align-items:start}.map-card,.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden}.map-stage{position:relative;aspect-ratio:1;background:#073e65}.map-stage>img{display:block;width:100%;height:100%;object-fit:contain}.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;background:transparent;border-radius:50%;z-index:1}.pin span{display:grid;place-items:center;width:27px;height:27px;border:2px solid #fff8d6;border-radius:50%;background:#302921bf;color:#fff;box-shadow:0 1px 6px #000a;font-size:12px;font-weight:700;line-height:1}.pin[aria-pressed="true"]{background:transparent}.pin[aria-pressed="true"] span{background:#e3b95a;color:#29281d;border-color:#fff}.pin:hover span{transform:scale(1.13)}.map-footer{padding:13px 16px 15px}.map-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.map-toolbar p{font-size:12px;margin:0;color:var(--muted)}#pins-toggle{font-size:12px;padding:5px 10px}.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}.legend button{border:0;padding:5px 0;text-align:left;background:transparent;min-height:44px;font-size:13px}.legend button[aria-pressed="true"]{color:var(--accent);font-weight:700;background:transparent}.legend .num{display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:23px;height:23px;font-size:11px;margin-right:7px;color:var(--accent)}.panel{position:sticky;top:14px;max-height:calc(100dvh - 28px);overflow:auto;padding:24px}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.6px;margin-bottom:4px}.panel .summary{color:var(--muted);margin-bottom:18px}.context{padding:12px 14px;border-left:3px solid #b68a40;background:var(--tint);margin:15px 0 20px}.context strong{display:block;margin-bottom:3px}.context p{margin:0;font-size:13px}.table-wrap{overflow:auto;margin:14px 0 19px}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px;line-height:1.75}th,td{text-align:left;vertical-align:top;padding:9px 7px;border:1px solid var(--line);overflow-wrap:anywhere}th{background:#eee7d9;font-weight:600}.easy{padding:10px 13px;border-left:3px solid #aa8652;background:#f5f0e5;font-size:13px;margin:15px 0}.bottom-note{color:var(--muted);font-size:12px;margin-top:20px}.map-stage.hide-pins .pin{display:none}@media(min-width:1600px){.panel{padding:27px}.panel p{font-size:16px}.panel table{font-size:13px}}@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:15px}.panel{padding:18px}main{padding:22px 17px 35px}}@media(max-width:800px){main{padding:20px 13px 32px}.layout{display:block}.panel{position:static;max-height:none;overflow:visible;margin-top:18px;padding:18px}.region-nav{gap:6px}.region-nav button{font-size:13px;flex:1 0 auto;padding:7px 10px}.legend{gap:4px 8px}.legend button{font-size:12px}h2{font-size:23px}.links{gap:7px 15px}.map-footer{padding:11px 12px 13px}.table-wrap{margin-left:-3px;margin-right:-3px}table{font-size:12px}th,td{padding:7px 5px}}
</style></head><body><main>
<h1>세계관 지도와 설정집</h1><p class="intro">대륙이나 지도 번호를 누르면 국가·수도·마탑·가문·신앙·부족 설정을 볼 수 있습니다.</p>
<nav class="links"><a href="__BOOK_HTML__">설정집 전체 읽기</a><a href="__MAP_URL__" target="_blank" rel="noopener">지도 원본</a><a href="__BOOK_MD__">Markdown 설정집</a><a href="__CANON_URL__">구조화 설정</a><a href="__GALLERY_URL__">캐릭터 제작 모음</a></nav>
<nav class="region-nav" id="region-nav" aria-label="대륙과 관계 선택"></nav>
<div class="layout"><section class="map-card" aria-label="오대륙 지도"><div class="map-stage" id="map-stage" style="aspect-ratio:__MAP_WIDTH__/__MAP_HEIGHT__"><img id="world-map" src="__MAP_URL__" width="__MAP_WIDTH__" height="__MAP_HEIGHT__" alt="국가·거점·지역 구획이 표시된 세계관 지도"></div><div class="map-footer"><div class="map-toolbar"><p id="map-version"></p><button id="pins-toggle" type="button" aria-pressed="true">지도 번호 숨기기</button></div><div class="legend" id="legend"></div></div></section><article class="panel" id="detail" aria-label="선택한 세계관 설정"></article></div>
<p class="bottom-note" id="boundary-guide"></p>
<p class="bottom-note">아르케리온은 독립 세력인 마탑이 자리한 작은 마법 수도입니다. 지도와 설정집에서 같은 지명과 세력 관계를 사용합니다.</p>
</main><script id="world-data" type="application/json">__WORLD_DATA__</script><script>
'use strict';
const world=JSON.parse(document.getElementById('world-data').textContent);
const nav=document.getElementById('region-nav'),stage=document.getElementById('map-stage'),legend=document.getElementById('legend'),panel=document.getElementById('detail');
let selectedView='central',selectedMarker=null;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function table(t){const wrap=el('div','table-wrap'),node=el('table'),head=el('thead'),hr=el('tr'),body=el('tbody');for(const title of t.headers){const th=el('th','',title);th.scope='col';hr.append(th);}head.append(hr);for(const row of t.rows){const tr=el('tr');for(const cell of row)tr.append(el('td','',cell));body.append(tr);}node.append(head,body);wrap.append(node);return wrap;}
function context(id){if(!id)return null;const cap=world.capitals.find(c=>c.id===id);if(cap)return {title:cap.name+' · '+cap.kind,text:cap.role};if(id==='great_church'){const church=world.institutions.find(i=>i.id===id);return {title:church.name,text:world.names.greatCapital+'의 대교회. 창조신 '+world.names.creator+'을 섬기며 중앙과 서부의 휴전을 중재했다. '+church.armed_force.description};}const landmark=(world.landmarks||[]).find(l=>l.id===id);if(landmark)return {title:landmark.name,text:landmark.location};return null;}
function render(view,focus){selectedView=view;selectedMarker=focus||null;panel.replaceChildren();panel.scrollTop=0;const info=context(focus);if(info){const box=el('div','context');box.append(el('strong','',info.title),el('p','',info.text));panel.append(box);}
 if(view==='relations'){
  panel.append(el('div','eyebrow','신앙과 국제 관계'),el('h2','','두 신앙과 주요 관계'),el('p','summary','대교회의 창조신 신앙과 남부의 사막신 신앙, 국가·마법도시·민족의 관계를 함께 정리했습니다.'));
  panel.append(el('h3','','두 신앙의 신'),table(world.tables.deities),el('h3','','주요 관계'),table(world.tables.relations));
 }else if(view==='landmarks'){
  panel.append(el('div','eyebrow','자연지리'),el('h2','','자연지리와 거점'));
  if(!focus&&world.mapLayoutText)panel.append(el('p','summary',world.mapLayoutText));
  if(!focus&&(world.peoples||[]).length)panel.append(el('p','summary',world.peoples_summary),table(world.tables.peoples));
  for(const landmark of (world.landmarks||[]).filter(l=>!focus||l.id===focus)){panel.append(el('h3','',landmark.name),el('p','summary',landmark.location));for(const paragraph of landmark.paragraphs)panel.append(el('p','',paragraph));const people=(world.peoples||[]).find(p=>p.id===landmark.people_id);if(people)for(const paragraph of people.paragraphs)panel.append(el('p','',paragraph));}
 }else{
  const region=world.regions.find(r=>r.id===view);panel.append(el('div','eyebrow',region.continent),el('h2','',region.name),el('p','summary',region.summary));
  for(const section of region.sections){panel.append(el('h3','',section.title));for(const p of section.paragraphs)panel.append(el('p','',p));if(section.table_source)panel.append(table(world.tables[section.table_source]));if(region.id==='central'&&section.title==='아르케리온의 충의와 자율')panel.append(el('p','easy',world.easyText));}
 }
 for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.view===view));
 for(const b of document.querySelectorAll('[data-marker]')){const marker=world.map.markers.find(m=>m.id===b.dataset.marker);b.setAttribute('aria-pressed',String(focus?marker.id===focus:view!=='relations'&&(marker.view_id||marker.region_id)===view));}
}
function select(view,focus,scroll){render(view,focus);const hash='#'+(focus||view);if(location.hash!==hash)history.replaceState(null,'',location.href.split('#')[0]+hash);if(scroll&&matchMedia('(max-width:800px)').matches)panel.scrollIntoView({behavior:'smooth',block:'start'});}
for(const region of world.regions){const b=el('button','',region.continent);b.type='button';b.dataset.view=region.id;b.addEventListener('click',()=>select(region.id,null,true));nav.append(b);}
const relations=el('button','','신앙·관계');relations.type='button';relations.dataset.view='relations';relations.addEventListener('click',()=>select('relations',null,true));nav.append(relations);
if((world.landmarks||[]).length){const b=el('button','','지리·거점');b.type='button';b.dataset.view='landmarks';b.addEventListener('click',()=>select('landmarks',null,true));nav.append(b);}
world.map.markers.forEach((m,i)=>{const action=()=>select(m.view_id||(m.id==='great_church'?'relations':m.region_id),m.id,true);const pin=el('button','pin');pin.type='button';pin.dataset.marker=m.id;pin.style.left=m.x*100+'%';pin.style.top=m.y*100+'%';pin.title=m.title+' · '+m.label;pin.setAttribute('aria-label',String(i+1)+' '+m.title+' '+m.label);pin.append(el('span','',String(i+1)));pin.addEventListener('click',action);stage.append(pin);const link=el('button');link.type='button';link.dataset.marker=m.id;link.append(el('span','num',String(i+1)),document.createTextNode(m.title));link.addEventListener('click',action);legend.append(link);});
document.getElementById('map-version').textContent='지도 v'+world.map.version+' · 설정집 v'+world.version;
document.getElementById('boundary-guide').textContent=world.map.boundary_note||'';
document.getElementById('pins-toggle').addEventListener('click',e=>{const hidden=stage.classList.toggle('hide-pins');e.currentTarget.setAttribute('aria-pressed',String(!hidden));e.currentTarget.textContent=hidden?'지도 번호 보이기':'지도 번호 숨기기';});
function restore(){const id=location.hash.slice(1),marker=world.map.markers.find(m=>m.id===id);if(marker)render(marker.view_id||(marker.id==='great_church'?'relations':marker.region_id),marker.id);else if(id==='relations'||id==='landmarks'||world.regions.some(r=>r.id===id))render(id,null);else render('central',null);}
addEventListener('hashchange',restore);restore();
</script></body></html>
